<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drone Orthos</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* WRI Drone Orthos -- Field App panel (same-origin with the app shell, reads the ExB session).
     Source of truth: C:\AppsScript\Initial Response Apps\ortho-tiles\panel\index.html
     Deployed copy:   ~\wri-field-app-work\panels\orthos\index.html
     Lists the Nova drone-ortho KML items in the WRI org and turns a tap into a hosted tiled-imagery
     layer on the incident map (worker: ortho-tiles.yml). Brand tokens follow panels/tasks. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#171919;--surface:#2a2c2c;--surface-alt:#3A3C3C;--accent:#EC2329;--text:#f0f0f0;--text-dim:#b8bcbc;--text-muted:#9a9e9e;
    --border:#4a4d4d;--success:#22c55e;--warning:#f59e0b;--font:'Alexandria',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;--head:'Epilogue','Alexandria',system-ui,sans-serif}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-touch-callout:none}
  #app{height:100%;display:flex;flex-direction:column}
  .view{flex:1;min-height:0;display:flex;flex-direction:column}
  .view[hidden]{display:none}
  .topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border);min-height:52px}
  .topbar h1{font-size:16px;font-weight:700;flex:1;font-family:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .sub{display:block;font-size:12px;font-weight:400;color:var(--text-dim);font-family:var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border);cursor:pointer;font-family:var(--font);white-space:nowrap;touch-action:manipulation}
  .chip:active{opacity:.8}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 40px}
  .card{padding:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .card .name{font-weight:600;font-size:15px;line-height:1.3}
  .card .meta{font-size:12.5px;color:var(--text-dim);margin-top:2px}
  .card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:#fff;font:600 14px var(--font);cursor:pointer;touch-action:manipulation}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--text-dim)}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn:active:not([disabled]){opacity:.85}
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--surface-alt);color:var(--text-dim);vertical-align:middle;margin-left:6px}
  .badge.green{background:#1f4d2a;color:#9be7ad}.badge.amber{background:#4a3306;color:#fbd38d}.badge.red{background:#4b1a1c;color:#fca5a5}.badge.blue{background:#1e3a5f;color:#9ec5ff}
  .group{margin:14px 0 6px;font:700 12px var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted)}
  .group.cur{color:#9be7ad}
  .mapline{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;color:var(--text-dim)}
  .mapline b{color:var(--text)}
  .note{font-size:12.5px;color:var(--text-muted);margin:8px 2px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--text-muted);border-top-color:var(--text);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .auth{padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1}
  .auth p{color:var(--text-dim);max-width:420px;font-size:14px}
  .diag{font-size:12px;color:var(--text-muted);max-width:440px;word-break:break-word}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;border:1px solid var(--border);max-width:92vw;z-index:50}
  #toast[hidden]{display:none}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  #modal[hidden]{display:none}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:440px;width:100%}
  .box h2{font:700 16px var(--head);margin-bottom:8px}.box p{color:var(--text-dim);font-size:14px;line-height:1.4}
  .box .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .err{color:#fca5a5;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><h1>Drone Orthos<span class="sub" id="subtitle">Nova orthos in WRI content</span></h1><button class="chip" id="btnReload">Refresh</button></div>
  <div class="mapline" id="mapline">Finding the incident map…</div>

  <section class="view" id="viewAuth" hidden>
    <div class="auth">
      <h2 style="font-family:var(--head)">Sign in needed</h2>
      <p id="authEmbedded" hidden>Open the <b>Incident Map</b> tab and sign in to ArcGIS. This page picks the session up automatically.</p>
      <p id="authStandalone" hidden>Sign in with your WRI ArcGIS account.</p>
      <div style="display:flex;gap:8px"><button class="btn primary" id="btnSignIn">Sign in</button><button class="btn" id="btnAuthRetry">Check again</button></div>
      <div class="err" id="authErr" hidden></div>
      <div class="diag" id="authDiag"></div>
    </div>
  </section>

  <section class="view" id="viewList" hidden>
    <div class="scroll" id="list"></div>
  </section>

  <div id="modal" hidden><div class="box"><h2 id="modalTitle"></h2><p id="modalText"></p>
    <div class="actions"><button class="btn ghost" id="modalNo">Cancel</button><button class="btn primary" id="modalYes">Confirm</button></div></div></div>
  <div id="toast" hidden></div>
</div>

<script>
(() => {
"use strict";
/* ============================================================ Config */
const PORTAL      = "https://wrienviro.maps.arcgis.com";
const ORG_ID      = "Ji79lWGR5B33LhY7";
const OAUTH_CLIENT = "zXmBr5FFTyHWfh24";                      // the Field App's OAuth app (this Pages origin)
const CALLBACK_URL = "https://whitewaterrescue.github.io/wri-respond/oauth-callback-201.html";
const SESSION_KEY = "wri_orthos_auth";
// hosted table WRI_Ortho_Requests (create_requests_table.py) -- filled in by add_orthos_page.py / by hand
const REQUESTS_URL = "https://services6.arcgis.com/Ji79lWGR5B33LhY7/arcgis/rest/services/WRI_Ortho_Requests/FeatureServer/0";
// wri-incident-admin GAS app: ?api=ortho-dispatch starts the worker at once (else the 30-min cron)
const DISPATCH_URL = "https://script.google.com/macros/s/AKfycbxfNt0qmV37WmLTsCxBsHj873kIZJWoYZQumbY40SBu5hMjkGcjr2WMoh1WPu5gZXVw/exec";
const TITLE_RE = /^(.+?)-(.+?)-ortho-(\d{10,16})(?:\.kml)?$/;
const POLL_MS = 10000, QUERY_TIMEOUT_MS = 30000;
const params = new URLSearchParams(location.search);
const DEV = params.get("dev") === "1";
const EMBEDDED = window.top !== window;
const $ = id => document.getElementById(id);
const state = {username: "", badToken: null, retryAt: 0, mapId: null, mapTitle: "", mapData: null, kmls: [], requests: {}, timer: null, busy: new Set()};

/* ============================================================ UI helpers */
function showView(id){ for (const v of document.querySelectorAll(".view")) v.hidden = v.id !== id; }
let toastT = null;
function toastMsg(msg, ms=3200){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
function confirmBox(title, text, yes="Confirm"){           // window.confirm() is a no-op inside the Field App iframe
  return new Promise(res => {
    $("modalTitle").textContent = title; $("modalText").textContent = text; $("modalYes").textContent = yes;
    const m = $("modal"); m.hidden = false;
    const done = v => { m.hidden = true; $("modalYes").onclick = $("modalNo").onclick = null; res(v); };
    $("modalYes").onclick = () => done(true); $("modalNo").onclick = () => done(false);
  });
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================ Auth ladder (annotator pattern) */
class AuthError extends Error {}
const diag = {record: "", verify: ""};
function renderAuthDiag(){ const el = $("authDiag"); if (el) el.textContent = [diag.record, diag.verify].filter(Boolean).join(" "); }
function readExbAuth(){
  let raw = null, from = "localStorage";
  try { raw = localStorage.getItem("exb_auth"); if (!raw) { raw = sessionStorage.getItem("exb_auth"); from = "sessionStorage"; } }
  catch (e) { diag.record = "Storage is blocked in this frame: " + (e.message || e); return null; }
  if (!raw) { diag.record = "No Field App session record in this frame yet."; return null; }
  let a; try { a = JSON.parse(raw); } catch (e) { diag.record = "The session record is not readable."; return null; }
  if (!a || !a.token) { diag.record = "The session record has no token."; return null; }
  const exp = a.expires != null && a.expires !== "" ? new Date(a.expires).getTime() : NaN;
  const who = a.email || a.username || "";
  diag.record = `Session in ${from}: user ${who || "?"}, ${!isFinite(exp) ? "no expiry recorded" : exp > Date.now() ? "expires in " + Math.round((exp - Date.now())/60000) + " min" : "expired"}.`;
  if (isFinite(exp) && exp - Date.now() < 2 * 60000) { diag.record += " Waiting for the app to refresh it."; return null; }
  if (state.badToken && a.token === state.badToken) { diag.record += " ArcGIS rejected it; waiting for a refresh."; return null; }
  return {token: a.token, username: who, source: "fieldapp"};
}
function readSession(){
  try { const a = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    if (!a || !a.token || !(a.expiresAt - Date.now() > 60000)) return null;
    if (state.badToken && a.token === state.badToken) return null;
    return {token: a.token, username: a.username || "", source: "popup"}; } catch (e) { return null; }
}
function getAuth(){ return readExbAuth() || readSession(); }
function dropAuth(token){ state.badToken = token || null; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function signIn(){
  const url = PORTAL + "/sharing/rest/oauth2/authorize?client_id=" + encodeURIComponent(OAUTH_CLIENT) + "&response_type=token&expiration=720&redirect_uri=" + encodeURIComponent(CALLBACK_URL);
  const w = window.open(url, "agolAuth", "width=480,height=640");     // synchronous: iOS blocks popups opened after an await
  if (!w) { showAuthErr("Popup blocked. Allow popups for this site and try again."); return; }
  $("authErr").hidden = true;
}
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;
  const d = e.data; if (!d || d.type !== "arcgis-auth") return;
  if (d.error || !d.token) { showAuthErr("ArcGIS sign-in failed" + (d.error ? ": " + d.error : "")); return; }
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({token: String(d.token), username: String(d.username || ""), expiresAt: Date.now() + (Number(d.expires_in) || 7200) * 1000})); } catch (x) {}
  state.badToken = null; boot();
});
function showAuthErr(msg){ const el = $("authErr"); el.textContent = msg; el.hidden = false; }
let authPoll = null;
function showAuth(){
  showView("viewAuth"); $("authEmbedded").hidden = !EMBEDDED; $("authStandalone").hidden = EMBEDDED;
  clearInterval(authPoll); renderAuthDiag();
  authPoll = setInterval(() => { const a = getAuth(); renderAuthDiag(); if (a && Date.now() >= (state.retryAt || 0)) { clearInterval(authPoll); boot(); } }, 2000);
}
window.addEventListener("storage", e => { if (e.key === "exb_auth" && !$("viewAuth").hidden && getAuth()) { clearInterval(authPoll); boot(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("viewAuth").hidden && getAuth()) { clearInterval(authPoll); boot(); } });
$("btnAuthRetry").onclick = () => { state.retryAt = 0; if (getAuth()) boot(); else { renderAuthDiag(); toastMsg("Not signed in yet. Open the Incident Map tab and sign in."); } };
$("btnSignIn").onclick = signIn;

async function rest(url, fields, opts = {}){
  const auth = getAuth(); if (!auth) throw new AuthError("Signed out");
  const timeout = opts.timeout || QUERY_TIMEOUT_MS, label = opts.label || "request";
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), timeout);
  try {
    const p = new URLSearchParams(); for (const [k, v] of Object.entries(fields || {})) if (v != null) p.set(k, String(v));
    p.set("f", "json"); p.set("token", auth.token);
    const r = await fetch(url, {method: "POST", body: p, signal: ac.signal});
    let j; try { j = await r.json(); } catch (e) { throw new Error(label + ": HTTP " + r.status + " (not JSON)"); }
    if (j && j.error) { const code = Number(j.error.code); if (code === 498 || code === 499) { dropAuth(auth.token); throw new AuthError(j.error.message || "Session expired"); } throw new Error(j.error.message || (label + " error " + code)); }
    return j;
  } catch (e) { if (e && e.name === "AbortError") throw new Error(label + " timed out"); throw e; } finally { clearTimeout(t); }
}
let verified = {token: null, username: ""};
async function verifyAuth(){
  const auth = getAuth(); if (!auth) throw new AuthError("Signed out");
  if (verified.token === auth.token) { state.username = verified.username; return; }
  diag.verify = "Checking the session with ArcGIS…"; renderAuthDiag();
  const j = await rest(PORTAL + "/sharing/rest/portals/self", {}, {label: "session check"});
  const u = j && j.user;
  if (!u || !u.username) { dropAuth(auth.token); diag.verify = "ArcGIS did not recognise the session."; renderAuthDiag(); throw new AuthError("no user"); }
  const org = u.orgId || j.id;       // orgId, never urlKey (a JS-API sign-in reads 'www')
  if (org && org !== ORG_ID) { dropAuth(auth.token); diag.verify = `Signed in as ${u.username}, but not in the WRI organisation.`; renderAuthDiag(); throw new AuthError("wrong org"); }
  verified = {token: auth.token, username: u.username}; state.username = u.username; diag.verify = "";
}
function handleErr(e, where){
  if (e instanceof AuthError) { toastMsg("Signed out of ArcGIS. Sign in again."); showAuth(); return; }
  console.error(where, e); toastMsg((where ? where + ": " : "") + (e && e.message || e), 5000);
}

/* ============================================================ Data */
async function currentMap(){
  // the Field App's own served config knows which incident map is active (same origin; cdn/** is cache-first in the SW -> bust it)
  try {
    const idx = await (await fetch("../../index.html?ts=" + Date.now(), {cache: "no-store"})).text();
    const m = idx.match(/base href="\.\/cdn\/(\d+)\/"/); if (!m) throw new Error("no cdn base");
    const cfg = await (await fetch(`../../cdn/${m[1]}/config.json?ts=` + Date.now(), {cache: "no-store"})).json();
    const ds = cfg.dataSources && cfg.dataSources.dataSource_1;
    state.mapId = params.get("map") || (ds && ds.itemId) || null;
    state.mapTitle = (ds && ds.sourceLabel) || "";
  } catch (e) { state.mapId = params.get("map") || null; }
  if (!state.mapId) { $("mapline").innerHTML = '<span class="err">Could not find the incident map id.</span>'; return; }
  const item = await rest(PORTAL + "/sharing/rest/content/items/" + state.mapId, {}, {label: "map item"});
  state.mapTitle = item.title || state.mapTitle;
  state.mapData = await rest(PORTAL + "/sharing/rest/content/items/" + state.mapId + "/data", {}, {label: "map data"});
  $("mapline").innerHTML = `Incident map: <b>${esc(state.mapTitle)}</b> <span class="note" style="display:inline">(${state.mapId.slice(0,8)}…)</span>`;
}
function walk(layers, out=[]){ for (const l of layers || []) { out.push(l); if (l.layerType === "GroupLayer") walk(l.layers, out); } return out; }
function onMap(kmlId){ return walk(state.mapData && state.mapData.operationalLayers).find(l => l.id === "ortho_" + kmlId) || null; }
function kmlOnMap(kmlId){ return walk(state.mapData && state.mapData.operationalLayers).find(l => l.layerType === "KML" && (l.itemId === kmlId || (l.url || "").includes(kmlId))) || null; }
function currentProjects(){ const s = new Set(); for (const l of walk(state.mapData && state.mapData.operationalLayers)) if (l.wriOrtho && l.wriOrtho.project) s.add(l.wriOrtho.project); return s; }
// Tell the app shell what orthos the web map holds now; the wri-map-guard widget on the Incident Map
// reconciles the LIVE MapView (adds new tiled layers, drops removed ones and the replaced KML), so a
// fresh ortho shows without reopening the map. Same origin -> window.top; the guard checks origin + mapId.
let lastSync = "";
function syncLiveMap(){
  if (!EMBEDDED || !state.mapId || !state.mapData) return;
  const layers = walk(state.mapData.operationalLayers).filter(l => typeof l.id === "string" && l.id.startsWith("ortho_") && l.url)
    .map(l => ({id: l.id, url: l.url, title: l.title, itemId: l.itemId, visible: l.visibility !== false,
                sourceKml: (l.wriOrtho && l.wriOrtho.sourceKml) || l.id.slice(6)}));
  const msg = {type: "wri-ortho-sync", mapId: state.mapId, layers};
  const key = JSON.stringify(msg);
  if (key === lastSync) return;
  lastSync = key;
  try { window.top.postMessage(msg, location.origin); } catch (e) { console.warn("live sync", e); }
}

async function loadKmls(){
  const j = await rest(PORTAL + "/sharing/rest/search", {q: `type:"KML" orgid:${ORG_ID}`, num: 100, sortField: "created", sortOrder: "desc"}, {label: "KML search"});
  state.kmls = (j.results || []).map(r => { const m = TITLE_RE.exec(r.title || ""); if (!m) return null;
    let epoch = Number(m[3]); if (epoch > 1e11) epoch = Math.floor(epoch / 1000);
    return {id: r.id, title: r.title, owner: r.owner, project: m[1], name: m[2].trim(), date: new Date(epoch * 1000), access: r.access}; }).filter(Boolean);
}
async function loadRequests(){
  state.imagery = state.imagery || {};
  // imagery already published for a KML (tag wri_source_kml:<id>) -- "Tiles ready" even when it never went through this queue
  try {
    const s = await rest(PORTAL + "/sharing/rest/search", {q: `tags:"wri_ortho" type:"Image Service" orgid:${ORG_ID}`, num: 100, sortField: "created", sortOrder: "desc"}, {label: "imagery search"});
    const by = {};
    for (const r of s.results || []) { const t = (r.tags || []).find(x => x.startsWith("wri_source_kml:")); if (t) by[t.slice(15)] = {id: r.id, url: r.url, title: r.title}; }
    state.imagery = by;
  } catch (e) { console.warn("imagery search", e); }
  if (!REQUESTS_URL || REQUESTS_URL.startsWith("__")) { state.requests = {}; return; }
  const ids = state.kmls.map(k => `'${k.id}'`).join(","); if (!ids) { state.requests = {}; return; }
  const j = await rest(REQUESTS_URL + "/query", {where: `kml_item_id IN (${ids})`, outFields: "*", returnGeometry: "false", orderByFields: "requested_at DESC"}, {label: "requests"});
  const by = {};
  for (const f of j.features || []) { const a = f.attributes; const key = a.kml_item_id + "|" + (a.target_map_id || ""); if (!by[key]) by[key] = a; }
  state.requests = by;
}
function reqFor(k){ return state.requests[k.id + "|" + state.mapId] || null; }
function imageryFor(k){ return (state.imagery || {})[k.id] || null; }

/* ============================================================ Render */
function stateOf(k){
  const r = reqFor(k), layer = onMap(k.id);
  if (r && (r.status === "queued" || r.status === "processing")) return {key: r.status, badge: `<span class="badge amber"><span class="spin"></span>${r.status === "queued" ? "Queued" : "Tiling in AGOL"}</span>`};
  // a newer ortho of the same ground leaves this one on the map but switched off (ortho_webmap
  // .apply_newest_at_location) -- say so, or "On the map" looks like a lie when nothing draws
  if (layer && layer.visibility === false) return {key: "onmap", badge: '<span class="badge">Superseded</span>',
    note: "A newer ortho covers this ground, so this one is on the map but switched off. Turn it on in the map's layer list to compare."};
  if (layer) return {key: "onmap", badge: '<span class="badge green">On the map</span>'};
  if (r && r.status === "held") return {key: "held", badge: '<span class="badge red">Needs Cody</span>'};
  if (r && r.status === "failed") return {key: "failed", badge: '<span class="badge red">Failed</span>'};
  if ((r && r.imagery_item_id) || imageryFor(k)) return {key: "ready", badge: '<span class="badge blue">Tiles ready</span>'};
  if (kmlOnMap(k.id)) return {key: "kmlonmap", badge: '<span class="badge red">KML on map (heavy)</span>'};
  return {key: "new", badge: ""};
}
function render(){
  const list = $("list"); const cur = currentProjects();
  if (!state.kmls.length) { list.innerHTML = '<p class="note">No Nova ortho KMLs found in the WRI organisation.</p>'; return; }
  const projects = []; for (const k of state.kmls) if (!projects.includes(k.project)) projects.push(k.project);
  projects.sort((a, b) => (cur.has(b) - cur.has(a)));
  let html = "";
  for (const p of projects) {
    html += `<div class="group ${cur.has(p) ? "cur" : ""}">${esc(p)}${cur.has(p) ? " · on this map" : ""}</div>`;
    for (const k of state.kmls.filter(x => x.project === p)) {
      const st = stateOf(k), r = reqFor(k), busy = state.busy.has(k.id);
      const when = k.date.toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"});
      let actions = "";
      if (st.key === "new" || st.key === "kmlonmap" || st.key === "failed") actions += `<button class="btn primary" data-act="convert" data-id="${k.id}" ${busy ? "disabled" : ""}>Add to incident map</button>`;
      if (st.key === "ready") actions += `<button class="btn primary" data-act="attach" data-id="${k.id}" ${busy ? "disabled" : ""}>Add to incident map</button>`;
      if (st.key === "onmap") actions += `<button class="btn" data-act="detach" data-id="${k.id}" ${busy ? "disabled" : ""}>Remove from map</button>`;
      if (st.key === "held") actions += `<button class="btn" data-act="convert" data-id="${k.id}" ${busy ? "disabled" : ""}>Try again</button>`;
      const msg = st.note ? `<div class="note">${esc(st.note)}</div>`
        : (r && r.message && st.key !== "onmap" ? `<div class="note">${esc(r.message)}${r.updated_at ? " · " + new Date(r.updated_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : ""}</div>` : "");
      html += `<div class="card"><div class="name">${esc(k.name)}${st.badge}</div><div class="meta">${when} · ${esc(k.owner)}${k.access === "public" ? " · public item" : ""}</div>${msg}<div class="actions">${actions}</div></div>`;
    }
  }
  html += `<p class="note">Tap <b>Add to incident map</b>: the KML's Nova image is turned into a hosted tiled-imagery layer (phone-safe) and added to the map's Overflights group; orthos from other incidents leave the map but stay in content. Takes a few minutes. Reopen the Incident Map afterwards to see it.</p>`;
  list.innerHTML = html;
  for (const b of list.querySelectorAll("button[data-act]")) b.onclick = () => act(b.dataset.act, b.dataset.id);
  const pending = state.kmls.some(k => ["queued", "processing"].includes(stateOf(k).key));
  clearInterval(state.timer); if (pending) state.timer = setInterval(() => refresh(true), POLL_MS);
}

/* ============================================================ Actions */
async function parseKml(kmlId){
  const auth = getAuth(); if (!auth) throw new AuthError("Signed out");
  const r = await fetch(PORTAL + "/sharing/rest/content/items/" + kmlId + "/data?token=" + encodeURIComponent(auth.token));
  const txt = await r.text();
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  const go = doc.getElementsByTagName("GroundOverlay")[0]; if (!go) throw new Error("This KML has no GroundOverlay (not a Nova ortho?)");
  const g = tag => { const el = go.getElementsByTagName(tag)[0]; return el ? el.textContent.trim() : null; };
  const ov = {name: g("name") || "Orthomosaic", href: g("href"), north: +g("north"), south: +g("south"), east: +g("east"), west: +g("west"), rotation: +(g("rotation") || 0)};
  if (!ov.href || !isFinite(ov.north) || !isFinite(ov.west)) throw new Error("KML is missing the image href or LatLonBox");
  if (Math.abs(ov.rotation) > 1e-6) throw new Error("Rotated overlays are not supported yet (rotation " + ov.rotation + ")");
  return ov;
}
async function act(mode, kmlId){
  const k = state.kmls.find(x => x.id === kmlId); if (!k) return;
  if (!REQUESTS_URL || REQUESTS_URL.startsWith("__")) { toastMsg("The requests table is not configured yet."); return; }
  const what = mode === "detach" ? `Remove "${k.name}" from ${state.mapTitle}?` : `Add "${k.name}" (${k.project}) to ${state.mapTitle}?`;
  const detail = mode === "detach" ? "The tiled layer comes off the map; the imagery item stays in content."
    : "The image is converted to a hosted tiled-imagery layer in AGOL and added to the Overflights group. Orthos from other incidents are taken off the map (they stay in content).";
  if (!(await confirmBox(what, detail, mode === "detach" ? "Remove" : "Add"))) return;
  state.busy.add(kmlId); render();
  try {
    const ov = mode === "detach" ? null : await parseKml(kmlId);
    const attrs = {kml_item_id: kmlId, kml_title: k.title, project: k.project, name: k.name, target_map_id: state.mapId, mode,
                   requested_by: state.username, requested_at: Date.now(), status: "queued", message: null, attempts: 0};
    if (ov) Object.assign(attrs, {image_url: ov.href, north: ov.north, south: ov.south, east: ov.east, west: ov.west, rotation: ov.rotation});
    const j = await rest(REQUESTS_URL + "/addFeatures", {features: JSON.stringify([{attributes: attrs}])}, {label: "queue"});
    const res = j.addResults && j.addResults[0];
    if (!res || !res.success) throw new Error("could not queue the request: " + JSON.stringify(j).slice(0, 200));
    const back = await rest(REQUESTS_URL + "/query", {where: "OBJECTID=" + res.objectId, outFields: "GlobalID,status", returnGeometry: "false"}, {label: "queue read-back"});
    const gid = back.features && back.features[0] && back.features[0].attributes.GlobalID;
    if (!gid) throw new Error("the request did not stick (read back empty)");
    toastMsg("Queued. Starting the worker…");
    // fast path: ask the incident-admin app to dispatch the worker now (text/plain body = no CORS preflight)
    try {
      const d = await (await fetch(DISPATCH_URL, {method: "POST", body: JSON.stringify({api: "ortho-dispatch", token: getAuth().token, request_id: gid})})).json();
      if (d && d.ok) toastMsg("Worker started — usually live in 3-6 minutes."); else toastMsg("Queued; worker runs on its 30-minute cycle (" + (d && d.error || "dispatch unavailable") + ")", 6000);
    } catch (e) { toastMsg("Queued; worker runs on its 30-minute cycle.", 5000); }
  } catch (e) { handleErr(e, "request"); }
  finally { state.busy.delete(kmlId); await refresh(true); }
}

/* ============================================================ Boot */
async function refresh(quiet){
  try { await verifyAuth(); if (!quiet) $("subtitle").textContent = "Loading…";
    await Promise.all([currentMap(), loadKmls()]); await loadRequests();
    $("subtitle").textContent = `${state.kmls.length} Nova orthos · signed in as ${state.username}`; render(); showView("viewList");
    syncLiveMap();
  } catch (e) { handleErr(e, quiet ? "" : "load"); }
}
async function boot(){
  clearInterval(authPoll);
  if (!getAuth()) { showAuth(); return; }
  await refresh(false);
}
$("btnReload").onclick = () => refresh(false);
boot();
})();
</script>
</body>
