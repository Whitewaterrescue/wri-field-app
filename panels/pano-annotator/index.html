<style>
  /* WRI 360 Annotator -- Field App panel. Draw points, lines and areas with labels ON a sphere;
     everyone who opens that sphere from the map sees them.
     Source of truth: C:\AppsScript\Initial Response Apps\pano-tiles\annot\index.html
     Deployed copy:   ~\wri-field-app-work\panels\pano-annotator\index.html   (+ pano-annot.js)

     Unlike the GRP photo annotator this never downloads the image: it draws on a LIVE Pannellum
     viewer over the real tiles, so there is no 2048 px work canvas and no iOS 16.7 MP canvas cap
     to dodge, and the geometry is saved as yaw/pitch -- re-editable, not burned into a JPEG.
     Brand tokens follow panels/panos. On-sphere colours come from pano-annot.js (cartography,
     not UI tokens) so the editor and the viewer look identical. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#171919;--surface:#2a2c2c;--surface-alt:#3A3C3C;--accent:#EC2329;--text:#f0f0f0;--text-dim:#b8bcbc;--text-muted:#9a9e9e;
    --border:#4a4d4d;--success:#22c55e;--warning:#f59e0b;--font:'Alexandria',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;--head:'Epilogue','Alexandria',system-ui,sans-serif}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  #app{height:100%;display:flex;flex-direction:column}
  .view{flex:1;min-height:0;display:flex;flex-direction:column}
  .view[hidden]{display:none}
  .topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border);min-height:52px}
  .topbar h1{font-size:16px;font-weight:700;flex:1;font-family:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .sub{display:block;font-size:12px;font-weight:400;color:var(--text-dim);font-family:var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border);cursor:pointer;font-family:var(--font);white-space:nowrap;touch-action:manipulation}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:active{opacity:.8}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 40px}
  .card{padding:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer}
  .card:active{opacity:.85}
  .card .name{font-weight:600;font-size:15px;line-height:1.3}
  .card .meta{font-size:12.5px;color:var(--text-dim);margin-top:2px}
  .btn{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:#fff;font:600 14px var(--font);cursor:pointer;touch-action:manipulation;min-height:44px}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--text-dim)}
  .btn.wide{width:100%;padding:14px}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn:active:not([disabled]){opacity:.85}
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:var(--surface-alt);color:var(--text-dim);vertical-align:middle;margin-left:6px}
  .badge.green{background:#1f4d2a;color:#9be7ad}.badge.blue{background:#1e3a5f;color:#9ec5ff}
  .group{margin:14px 0 6px;font:700 12px var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted)}
  .mapline{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;color:var(--text-dim)}
  .mapline b{color:var(--text)}
  .note{font-size:12.5px;color:var(--text-muted);margin:8px 2px;line-height:1.45}
  .warn{font-size:12.5px;color:#fbd38d;background:#3a2c10;border:1px solid #6b5316;border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.4}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--text-muted);border-top-color:var(--text);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .auth{padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1}
  .auth p{color:var(--text-dim);max-width:420px;font-size:14px}
  .diag{font-size:12px;color:var(--text-muted);max-width:440px;word-break:break-word}
  input[type=text],input[type=search]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:400 16px var(--font)}
  /* above the toolbar (52px) + footer (~52px), so a toast never covers the tools it refers to */
  #toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;border:1px solid var(--border);max-width:92vw;z-index:80;text-align:center}
  #toast[hidden]{display:none}
  #modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
  #modal[hidden]{display:none}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:440px;width:100%}
  .box h2{font:700 16px var(--head);margin-bottom:8px}.box p{color:var(--text-dim);font-size:14px;line-height:1.4}
  .box .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .err{color:#fca5a5;font-size:13px}

  /* ---- draw view ---- */
  #stage{flex:1;min-height:0;position:relative;background:#0d0f12}
  #sphere{position:absolute;top:0;right:0;bottom:0;left:0}
  /* left:48px clears Pannellum's zoom control, which sits top-left inside the stage */
  #hint{position:absolute;top:10px;left:48px;right:10px;z-index:7;pointer-events:none;
    background:rgba(13,15,18,.82);border-left:3px solid var(--accent);border-radius:3px;
    padding:7px 10px;font-size:12.5px;line-height:1.35;color:#e8eaed}
  #hint[hidden]{display:none}
  /* Handles are drawn into the overlay's SVG edit layer by drawEdit(). */
  .toolbar{display:flex;gap:6px;padding:8px;background:var(--bg);border-top:1px solid var(--border);align-items:center}
  .tool{flex:1;min-width:0;min-height:52px;border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text-dim);
    font:600 12px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation}
  .tool.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tool[disabled]{opacity:.4}
  .tool .gl{font-size:15px;line-height:1}
  .sheet{padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .sheet[hidden]{display:none}
  .sheetRow{display:flex;gap:8px;align-items:center}
  .sheetRow input{flex:1}
  .sheet textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font:400 15px/1.4 var(--font);resize:vertical;min-height:52px}
  .sheetHint{font-size:11.5px;color:var(--text-muted)}
  /* Colour swatches. On-sphere colours are cartography, so these are the palette from
     pano-annot.js, not UI tokens -- the chip shows exactly what will be drawn. */
  #swatches{display:flex;gap:6px;padding:8px 12px 0;align-items:center;overflow-x:auto}
  #swatches[hidden]{display:none}
  .sw-dot{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;touch-action:manipulation;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
  .sw-dot.on{border-color:#fff;transform:scale(1.06)}
  .sw-label{font-size:11.5px;color:var(--text-muted);margin-left:2px;white-space:nowrap}
  .footer{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg);border-top:1px solid var(--border)}
  .sw{display:flex;align-items:center;gap:8px;flex:1;font-size:12.5px;color:var(--text-dim);cursor:pointer;line-height:1.25}
  .sw input{width:20px;height:20px;accent-color:var(--accent);flex:none}
</style>
</head>
<body>
<div id="app">

  <!-- ================= sign in ================= -->
  <section class="view" id="viewAuth">
    <div class="topbar"><h1>360 Annotator</h1></div>
    <div class="auth">
      <div id="authEmbedded" hidden>
        <p><b>Sign in to ArcGIS to continue.</b></p>
        <p>Open the <b>Incident Map</b> tab, sign in there, then come back to this page.</p>
      </div>
      <div id="authStandalone" hidden>
        <p>Sign in with your WRI ArcGIS account to draw on a sphere.</p>
        <button class="btn primary" id="btnSignIn">Sign in to ArcGIS</button>
      </div>
      <p class="diag" id="authDiag"></p>
      <p class="err" id="authErr" hidden></p>
      <button class="btn ghost" id="btnAuthRetry">Check again</button>
    </div>
  </section>

  <!-- ================= pick a sphere ================= -->
  <section class="view" id="viewPick" hidden>
    <div class="topbar">
      <h1>360 Annotator<span class="sub" id="whoLine"></span></h1>
      <button class="chip" id="btnReload">Reload</button>
    </div>
    <div class="mapline" id="mapline">Finding the incident map…</div>
    <div style="padding:10px 12px 0"><input type="search" id="search" placeholder="Search spheres" autocomplete="off"></div>
    <div id="srcRow" style="display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto"></div>
    <div class="scroll" id="panoList"></div>
  </section>

  <!-- ================= draw ================= -->
  <section class="view" id="viewDraw" hidden>
    <div class="topbar">
      <button class="chip" id="btnBack">Spheres</button>
      <h1 id="drawTitle">Sphere<span class="sub" id="drawSub"></span></h1>
      <button class="btn primary" id="btnSave" disabled>Save</button>
    </div>

    <div id="stage">
      <div id="sphere"></div>
      <div id="hint"></div>
    </div>

    <div id="swatches"></div>

    <div class="sheet" id="labelSheet" hidden>
      <div class="sheetRow">
        <input type="text" id="labelInput" placeholder="What is this? e.g. Parking" maxlength="80" autocomplete="off">
        <button class="btn" id="btnLabelOk">Done</button>
      </div>
      <textarea id="noteInput" rows="2" maxlength="600" autocomplete="off"
        placeholder="Details (optional) — shown when someone taps this shape. e.g. Boats park on the right, cars on the left. Clear the lot by 1700."></textarea>
      <div class="sheetHint" id="noteHint"></div>
    </div>

    <div class="toolbar">
      <button class="tool on" id="tSelect"><span class="gl">&#9995;</span>Select</button>
      <button class="tool" id="tPoint"><span class="gl">&#9679;</span>Point</button>
      <button class="tool" id="tLine"><span class="gl">&#9585;</span>Line</button>
      <button class="tool" id="tArea"><span class="gl">&#9648;</span>Area</button>
      <button class="tool" id="tUndo"><span class="gl">&#8630;</span>Undo</button>
      <button class="tool" id="tDelete"><span class="gl">&#10005;</span>Delete</button>
    </div>

    <div class="footer">
      <label class="sw"><input type="checkbox" id="pubOk"><span id="pubTxt">Show these labels and details on the public gateway</span></label>
      <button class="btn ghost" id="btnDone">Finish</button>
    </div>
  </section>

  <div id="modal" hidden><div class="box"><h2 id="modalTitle"></h2><p id="modalText"></p>
    <div class="actions"><button class="btn ghost" id="modalNo">Cancel</button><button class="btn primary" id="modalYes">Confirm</button></div></div></div>
  <div id="toast" hidden></div>
</div>

<script>
(() => {
"use strict";
/* ============================================================ Config */
const PORTAL       = "https://wrienviro.maps.arcgis.com";
const ORG_ID       = "Ji79lWGR5B33LhY7";
const OAUTH_CLIENT = "zXmBr5FFTyHWfh24";                       // the Field App's OAuth app (this Pages origin)
const CALLBACK_URL = "https://whitewaterrescue.github.io/wri-respond/oauth-callback-201.html";
const SESSION_KEY  = "wri_pano_annot_auth";
const APP_VERSION  = "pano-annot-1.0";

// The annotation store (create_annot_table.py). One row per sphere, keyed by pano_key.
const ANNOT_URL = "https://services6.arcgis.com/Ji79lWGR5B33LhY7/arcgis/rest/services/WRI_Pano_Annotations/FeatureServer/0";
// The incident sphere set, pinned first in the picker because it is the one used during a response.
const PANO_LAYER_ID   = "wri_incident_panos";
const PANO_SOURCE_URL = "https://services6.arcgis.com/Ji79lWGR5B33LhY7/arcgis/rest/services/WRIIncident360Panoramas/FeatureServer/0";
const CLIENTS = {"5e30a96b8bcc4d6f981ce7b7435c61c0": "BNSF", "ecff87d286874a8d864c2a9935811ea6": "UP",
                 "e6406c338b7c4e8598503d4e15cb9f62": "MT/WY Coop", "373f7625cfc74c87a8523fbaf7ad9691": "WRI"};

// annot_json is String(32000) and can never be widened on a hosted layer, so stop well short and
// say so, rather than letting AGOL truncate or roll the write back.
const MAX_JSON = 28000;
const QUERY_TIMEOUT_MS = 30000;
const TAP_PX = 8;                       // beyond this a pointer gesture was a pan, not a tap
const COARSE = matchMedia("(pointer: coarse)").matches;
const HIT = COARSE ? 26 : 14;
const HANDLE_R = COARSE ? 10 : 6;
const DRAFT_KEY = k => "wri_pano_annot_draft:" + k;

const params = new URLSearchParams(location.search);
const EMBEDDED = window.top !== window;
const $ = id => document.getElementById(id);
const A = window.WRIPanoAnnot;

const state = {
  username: "", badToken: null, retryAt: 0,
  mapId: null, mapTitle: "", project: null, client: "",
  sources: [], sourceKey: "incident", panos: [], filter: "",
  pano: null, key: null, oid: null, publicOk: false,
  shapes: [], sel: null, tool: "select", draft: null, dirty: false, color: "yellow",
  viewer: null, overlay: null, saving: false
};

/* ============================================================ UI helpers */
function showView(id){ for (const v of document.querySelectorAll(".view")) v.hidden = v.id !== id; }
let toastT = null;
function toastMsg(msg, ms=3200){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
function confirmBox(title, text, yes="Confirm"){           // window.confirm() is a no-op in the Field App iframe (no allow-modals)
  return new Promise(res => {
    $("modalTitle").textContent = title; $("modalText").textContent = text; $("modalYes").textContent = yes;
    const m = $("modal"); m.hidden = false;
    const done = v => { m.hidden = true; $("modalYes").onclick = $("modalNo").onclick = null; res(v); };
    $("modalYes").onclick = () => done(true); $("modalNo").onclick = () => done(false);
  });
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================ Auth ladder (annotator pattern) */
class AuthError extends Error {}
const diag = {record: "", verify: ""};
function renderAuthDiag(){ const el = $("authDiag"); if (el) el.textContent = [diag.record, diag.verify].filter(Boolean).join(" "); }
function readExbAuth(){
  let raw = null, from = "localStorage";
  try { raw = localStorage.getItem("exb_auth"); if (!raw) { raw = sessionStorage.getItem("exb_auth"); from = "sessionStorage"; } }
  catch (e) { diag.record = "Storage is blocked in this frame: " + (e.message || e); return null; }
  if (!raw) { diag.record = "No Field App session record in this frame yet."; return null; }
  let a; try { a = JSON.parse(raw); } catch (e) { diag.record = "The session record is not readable."; return null; }
  if (!a || !a.token) { diag.record = "The session record has no token."; return null; }
  // `expires` is an ISO string in current builds, a number in older ones, and absent when the
  // session came from a JS API credential -- absence is NOT a rejection.
  const exp = a.expires != null && a.expires !== "" ? new Date(a.expires).getTime() : NaN;
  const who = a.email || a.username || "";
  diag.record = `Session in ${from}: user ${who || "?"}, ${!isFinite(exp) ? "no expiry recorded" : exp > Date.now() ? "expires in " + Math.round((exp - Date.now())/60000) + " min" : "expired"}.`;
  if (isFinite(exp) && exp - Date.now() < 2 * 60000) { diag.record += " Waiting for the app to refresh it."; return null; }
  if (state.badToken && a.token === state.badToken) { diag.record += " ArcGIS rejected it; waiting for a refresh."; return null; }
  return {token: a.token, username: who, source: "fieldapp"};
}
function readSession(){
  try { const a = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    if (!a || !a.token || !(a.expiresAt - Date.now() > 60000)) return null;
    if (state.badToken && a.token === state.badToken) return null;
    return {token: a.token, username: a.username || "", source: "popup"}; } catch (e) { return null; }
}
function getAuth(){ return readExbAuth() || readSession(); }
function dropAuth(token){ state.badToken = token || null; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function signIn(){
  const url = PORTAL + "/sharing/rest/oauth2/authorize?client_id=" + encodeURIComponent(OAUTH_CLIENT) +
              "&response_type=token&expiration=720&redirect_uri=" + encodeURIComponent(CALLBACK_URL);
  const w = window.open(url, "agolAuth", "width=480,height=640");   // synchronous: iOS blocks popups opened after an await
  if (!w) { showAuthErr("Popup blocked. Allow popups for this site and try again."); return; }
  $("authErr").hidden = true;
}
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;
  const d = e.data; if (!d || d.type !== "arcgis-auth") return;
  if (d.error || !d.token) { showAuthErr("ArcGIS sign-in failed" + (d.error ? ": " + d.error : "")); return; }
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({token: String(d.token), username: String(d.username || ""), expiresAt: Date.now() + (Number(d.expires_in) || 7200) * 1000})); } catch (x) {}
  state.badToken = null; boot();
});
function showAuthErr(msg){ const el = $("authErr"); el.textContent = msg; el.hidden = false; }
let authPoll = null;
function showAuth(){
  showView("viewAuth"); $("authEmbedded").hidden = !EMBEDDED; $("authStandalone").hidden = EMBEDDED;
  clearInterval(authPoll); renderAuthDiag();
  authPoll = setInterval(() => { const a = getAuth(); renderAuthDiag(); if (a && Date.now() >= (state.retryAt || 0)) { clearInterval(authPoll); boot(); } }, 2000);
}
window.addEventListener("storage", e => { if (e.key === "exb_auth" && !$("viewAuth").hidden && getAuth()) { clearInterval(authPoll); boot(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("viewAuth").hidden && getAuth()) { clearInterval(authPoll); boot(); } });
$("btnAuthRetry").onclick = () => { state.retryAt = 0; if (getAuth()) boot(); else { renderAuthDiag(); toastMsg("Not signed in yet. Open the Incident Map tab and sign in."); } };
$("btnSignIn").onclick = signIn;

async function rest(url, fields, opts = {}){
  const auth = getAuth(); if (!auth) throw new AuthError("Signed out");
  const timeout = opts.timeout || QUERY_TIMEOUT_MS, label = opts.label || "request";
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), timeout);
  try {
    const body = new URLSearchParams();
    for (const [k, v] of Object.entries(fields || {})) if (v != null) body.set(k, String(v));
    body.set("f", "json"); body.set("token", auth.token);
    const r = await fetch(url, {method: "POST", body, signal: ac.signal});
    let j; try { j = await r.json(); } catch (e) { throw new Error(label + ": HTTP " + r.status + " (not JSON)"); }
    if (j && j.error) {
      const code = Number(j.error.code);
      if (code === 498 || code === 499) { dropAuth(auth.token); throw new AuthError(j.error.message || "Session expired"); }
      throw new Error(j.error.message || (label + " error " + code));
    }
    return j;
  } catch (e) { if (e && e.name === "AbortError") throw new Error(label + " timed out"); throw e; } finally { clearTimeout(t); }
}
let verified = {token: null, username: ""};
async function verifyAuth(){
  const auth = getAuth(); if (!auth) throw new AuthError("Signed out");
  if (verified.token === auth.token) { state.username = verified.username; return; }
  diag.verify = "Checking the session with ArcGIS…"; renderAuthDiag();
  const j = await rest(PORTAL + "/sharing/rest/portals/self", {}, {label: "session check"});
  const u = j && j.user;
  if (!u || !u.username) { dropAuth(auth.token); diag.verify = "ArcGIS did not recognise the session."; renderAuthDiag(); throw new AuthError("no user"); }
  const org = u.orgId || j.id;      // orgId, never urlKey -- a JS-API map sign-in reads 'www'
  if (org && org !== ORG_ID) { dropAuth(auth.token); diag.verify = `Signed in as ${u.username}, but not in the WRI organisation.`; renderAuthDiag(); throw new AuthError("wrong org"); }
  verified = {token: auth.token, username: u.username}; state.username = u.username; diag.verify = "";
}
function handleErr(e, where){
  if (e instanceof AuthError) { toastMsg("Signed out of ArcGIS. Sign in again."); showAuth(); return; }
  console.error(where, e); toastMsg((where ? where + ": " : "") + (e && e.message || e), 5000);
}

/* ============================================================ Sphere sets */
function walk(layers, out=[]){ for (const l of layers || []) { out.push(l); if (l.layerType === "GroupLayer") walk(l.layers, out); } return out; }

async function currentMap(){
  // The Field App's own served config knows which incident map is active (same origin; cdn/** is
  // cache-first in the service worker, so bust it).
  try {
    const idx = await (await fetch("../../index.html?ts=" + Date.now(), {cache: "no-store"})).text();
    const m = idx.match(/base href="\.\/cdn\/(\d+)\/"/); if (!m) throw new Error("no cdn base");
    const cfg = await (await fetch(`../../cdn/${m[1]}/config.json?ts=` + Date.now(), {cache: "no-store"})).json();
    const ds = cfg.dataSources && cfg.dataSources.dataSource_1;
    state.mapId = params.get("map") || (ds && ds.itemId) || null;
    state.mapTitle = (ds && ds.sourceLabel) || "";
  } catch (e) { state.mapId = params.get("map") || null; }
  if (!state.mapId) { $("mapline").textContent = "No incident map found; showing every sphere set."; return; }
  try {
    const item = await rest(PORTAL + "/sharing/rest/content/items/" + state.mapId, {}, {label: "map item"});
    state.mapTitle = item.title || state.mapTitle;
    const data = await rest(PORTAL + "/sharing/rest/content/items/" + state.mapId + "/data", {}, {label: "map data"});
    state.client = CLIENTS[state.mapId] || "";
    // The project comes from the pano layer's OWN filter on this map -- exactly what the map,
    // the viewers and the gateway are showing right now.
    const layer = walk(data && data.operationalLayers).find(l => l.id === PANO_LAYER_ID);
    const de = layer && ((layer.layerDefinition || {}).definitionExpression || "");
    const m = /project_name\s*=\s*'([^']+)'/i.exec(de || "");
    state.project = m ? m[1] : null;
    $("mapline").innerHTML = `<b>${esc(state.mapTitle)}</b>` +
      (state.project ? ` · project <b>${esc(state.project)}</b>` : " · no project filter on the 360 layer") +
      (state.client ? ` · ${esc(state.client)}` : "");
  } catch (e) {
    $("mapline").textContent = "Could not read the incident map; showing every sphere set.";
  }
}

/**
 * Every sphere set WRI hosts, found rather than hard-coded: search the org for feature services
 * that look panoramic, then keep any layer that actually carries a pano_url field. A sphere set
 * added next year shows up here with no code change. Cached for the session.
 */
async function discoverSources(){
  const pinned = {key: "incident", title: "This incident", url: PANO_SOURCE_URL,
                  where: state.project ? `project_name='${state.project.replace(/'/g, "''")}'` : "1=1"};
  const all = {key: "incident_all", title: "All incident spheres", url: PANO_SOURCE_URL, where: "1=1"};
  let extra = [];
  try {
    const cached = JSON.parse(sessionStorage.getItem("wri_pano_sources") || "null");
    if (cached && Array.isArray(cached)) extra = cached;
  } catch (e) {}
  if (!extra.length) {
    try {
      const s = await rest(PORTAL + "/sharing/rest/search", {
        q: `(panorama OR panoramas OR 360) AND type:"Feature Service" AND orgid:${ORG_ID}`,
        num: 50, sortField: "title", sortOrder: "asc"}, {label: "sphere sets"});
      const items = (s.results || []).filter(i =>
        i.url &&
        !/Pano_Annotations/i.test(i.url) &&
        // Hosted views duplicate their source row for row, and every WRI sphere set has its
        // source in this org. Listing both would offer the same spheres twice under two names.
        !(i.typeKeywords || []).includes("View Service"));
      const defs = await Promise.allSettled(items.map(async i => {
        // One request per service returns every layer definition, rather than one per layer.
        const j = await rest(i.url + "/layers", {}, {label: "layers"});
        return (j.layers || []).filter(l => {
          const f = new Set((l.fields || []).map(x => x.name));
          // WRI_Pano_Requests carries pano_url too, but it is the upload QUEUE -- transient rows
          // for spheres that may not exist yet. Detect it by shape, not by name.
          return f.has("pano_url") && !(f.has("status") && f.has("file_name"));
        }).map(l => ({key: i.id + ":" + l.id, title: i.title, url: i.url + "/" + l.id, where: "1=1"}));
      }));
      extra = defs.filter(r => r.status === "fulfilled").flatMap(r => r.value)
        .filter(src => src.url.indexOf(PANO_SOURCE_URL) !== 0);
      try { sessionStorage.setItem("wri_pano_sources", JSON.stringify(extra)); } catch (e) {}
    } catch (e) { extra = []; }
  }
  state.sources = (state.project ? [pinned, all] : [all]).concat(extra);
  if (!state.sources.some(s => s.key === state.sourceKey)) state.sourceKey = state.sources[0].key;
}

async function loadPanos(){
  const src = state.sources.find(s => s.key === state.sourceKey);
  if (!src) { state.panos = []; return; }
  const j = await rest(src.url + "/query", {
    where: src.where, outFields: "*", returnGeometry: "false", resultRecordCount: 500
  }, {label: "spheres"});
  state.panos = (j.features || []).map(f => f.attributes)
    .filter(a => a.pano_url)
    .sort((a, b) => String(b.captured_date || "").localeCompare(String(a.captured_date || "")));
}

/** Which of these spheres already carry labels, so the list can say so. */
async function loadAnnotated(){
  const keys = state.panos.map(p => A.panoKey(p.pano_url)).filter(Boolean);
  if (!keys.length) return new Map();
  const inList = keys.map(k => A.sqlQuote(k)).join(",");
  try {
    const j = await rest(ANNOT_URL + "/query", {
      where: `pano_key IN (${inList})`, outFields: "pano_key,shape_count,public_ok,updated_by",
      returnGeometry: "false"}, {label: "labels"});
    return new Map((j.features || []).map(f => [f.attributes.pano_key, f.attributes]));
  } catch (e) { return new Map(); }
}

function renderSources(){
  const row = $("srcRow"); row.innerHTML = "";
  for (const s of state.sources) {
    const b = document.createElement("button");
    b.className = "chip" + (s.key === state.sourceKey ? " on" : "");
    b.textContent = s.title;
    b.onclick = () => { state.sourceKey = s.key; refreshList(); };
    row.appendChild(b);
  }
}

function renderPanos(annots){
  const list = $("panoList"); list.innerHTML = "";
  const q = state.filter.trim().toLowerCase();
  const rows = state.panos.filter(p => !q ||
    [p.pano_name, p.site_label, p.project_name].some(v => String(v || "").toLowerCase().includes(q)));
  if (!rows.length) {
    list.innerHTML = `<p class="note">No spheres here${q ? " match that search" : ""}.</p>`;
    return;
  }
  for (const p of rows) {
    const key = A.panoKey(p.pano_url);
    const a = key && annots.get(key);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      `<div class="name">${esc(p.pano_name || "(untitled sphere)")}` +
      (a ? `<span class="badge green">${a.shape_count || 0} label${a.shape_count === 1 ? "" : "s"}</span>` : "") +
      (a && Number(a.public_ok) === 1 ? `<span class="badge blue">public</span>` : "") + `</div>` +
      `<div class="meta">${esc(p.site_label || "")}${p.captured_date ? " · " + esc(p.captured_date) : ""}</div>`;
    card.onclick = () => openPano(p);
    list.appendChild(card);
  }
}

async function refreshList(){
  renderSources();
  $("panoList").innerHTML = '<p class="note"><span class="spin"></span>Loading spheres…</p>';
  try {
    await loadPanos();
    renderPanos(await loadAnnotated());
  } catch (e) { handleErr(e, "spheres"); }
}

/* ============================================================ Draw view */
const round2 = n => Math.round(n * 100) / 100;
const newId = () => Math.random().toString(36).slice(2, 7);
const MIN_PTS = {point: 1, line: 2, area: 3};

function setTool(t){
  state.tool = t;
  for (const [id, name] of [["tSelect","select"],["tPoint","point"],["tLine","line"],["tArea","area"]])
    $(id).classList.toggle("on", name === t);
  if (t !== "select") state.sel = null;
  renderHint(); redraw();
}

function renderHint(){
  const h = $("hint");
  let msg = "";
  if (state.draft) {
    const n = state.draft.pts.length, need = MIN_PTS[state.draft.kind];
    msg = `Tap to add points (${n}). ` + (n >= need ? "Tap <b>Undo</b> to step back, or <b>Done</b> to name it." : `Needs at least ${need}.`);
    if (n >= need) msg = msg.replace("<b>Done</b>", "<b>Done</b>");
  } else if (state.tool === "point") msg = "Tap the thing you want to name. Drag to look around.";
  else if (state.tool === "line") msg = "Tap along the feature. Drag to look around.";
  else if (state.tool === "area") msg = "Tap around the area. Drag to look around.";
  else if (state.sel) msg = "Drag a handle to move it. <b>Delete</b> removes it.";
  else msg = state.shapes.length ? "Tap a label to edit it, or pick a tool below." : "Pick a tool below and tap on the sphere.";
  h.innerHTML = msg;
  h.hidden = false;
  // The draft bar lives in the toolbar: Undo/Delete become step-back/cancel while drawing.
  $("tUndo").querySelector(".gl").innerHTML = state.draft ? "&#8630;" : "&#8630;";
  $("tDelete").lastChild.textContent = state.draft ? "Done" : "Delete";
  $("tDelete").querySelector(".gl").innerHTML = state.draft ? "&#10003;" : "&#10005;";
  $("tDelete").disabled = state.draft ? state.draft.pts.length < MIN_PTS[state.draft.kind] : !state.sel;
  $("tUndo").disabled = state.draft ? !state.draft.pts.length : !state.shapes.length;
}

function redraw(){
  if (!state.overlay) return;
  state.overlay.setShapes(state.shapes.concat(state.draft ? [state.draft] : []));
}

/** Vertex handles for the selected shape and the in-progress draft, into the overlay's edit layer. */
function drawEdit(cam, layer){
  while (layer.firstChild) layer.removeChild(layer.firstChild);
  const shape = state.draft || (state.sel && state.shapes.find(s => s.id === state.sel));
  if (!shape) return;
  for (const p of shape.pts) {
    const pr = A.project(cam, p[0], p[1]);
    if (pr.z <= 0.02) continue;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", pr.x); c.setAttribute("cy", pr.y); c.setAttribute("r", HANDLE_R);
    c.setAttribute("fill", "#fff"); c.setAttribute("stroke", "#171919"); c.setAttribute("stroke-width", 2);
    layer.appendChild(c);
  }
}

function markDirty(){ state.dirty = true; $("btnSave").disabled = state.saving; saveDraftSoon(); }

let draftT = null;
function saveDraftSoon(){
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    try { sessionStorage.setItem(DRAFT_KEY(state.key), JSON.stringify({shapes: state.shapes, publicOk: state.publicOk})); } catch (e) {}
  }, 250);
}
function clearDraftStore(){ try { sessionStorage.removeItem(DRAFT_KEY(state.key)); } catch (e) {} }

/* ---- pointer handling -------------------------------------------------------------------
   Pannellum owns the gesture: drag always pans the sphere. We watch the pointer stream (a
   separate event stream from the mouse/touch handlers Pannellum uses) and only act when the
   pointer barely moved -- i.e. it was a tap. The one case that must NOT pan is dragging a vertex
   handle, and Pannellum reads config.draggable live on every mousedown/touchstart, so flipping it
   for the duration of the drag is enough.                                                      */
let down = null, drag = null;

function suspendPan(on){
  try { state.viewer.getConfig().draggable = !on; } catch (e) {}
}

function onPointerDown(e){
  if (!state.overlay) return;
  if (state.tool === "select" && !state.draft) {
    const hit = state.overlay.hitTest(e.clientX, e.clientY, HIT);
    if (hit && hit.vertex !== null && state.sel === hit.shape.id) {
      drag = {shape: hit.shape, vertex: hit.vertex, id: e.pointerId};
      suspendPan(true);
      e.stopPropagation();
      return;
    }
  }
  down = {x: e.clientX, y: e.clientY, id: e.pointerId};
}

function onPointerMove(e){
  if (!drag || e.pointerId !== drag.id) return;
  const c = state.overlay.unproject(e.clientX, e.clientY);
  drag.shape.pts[drag.vertex] = [round2(c[0]), round2(c[1])];
  state.overlay.invalidate();
  e.stopPropagation();
}

function onPointerUp(e){
  if (drag && e.pointerId === drag.id) { drag = null; suspendPan(false); markDirty(); e.stopPropagation(); return; }
  if (!down || e.pointerId !== down.id) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved > TAP_PX) return;                    // that was a pan; Pannellum already handled it
  onTap(e.clientX, e.clientY);
}

function onTap(cx, cy){
  const c = state.overlay.unproject(cx, cy);
  const pt = [round2(c[0]), round2(c[1])];

  if (state.tool === "point") {
    const s = {id: newId(), kind: "point", label: "", c: state.color, pts: [pt]};
    state.shapes.push(s); markDirty(); setTool("select"); state.sel = s.id; redraw(); editLabel(s);
    return;
  }
  if (state.tool === "line" || state.tool === "area") {
    if (!state.draft) state.draft = {id: newId(), kind: state.tool, label: "", c: state.color, pts: []};
    state.draft.pts.push(pt);
    renderHint(); redraw();
    return;
  }
  // select
  const hit = state.overlay.hitTest(cx, cy, HIT);
  state.sel = hit ? hit.shape.id : null;
  if (hit && hit.shape.c) { state.color = hit.shape.c; renderSwatches(); }
  renderHint(); redraw();
  if (hit) editLabel(hit.shape);
}

function finishDraft(){
  const d = state.draft;
  if (!d || d.pts.length < MIN_PTS[d.kind]) return;
  state.draft = null;
  state.shapes.push(d);
  state.sel = d.id;
  markDirty(); setTool("select"); redraw(); editLabel(d);
}

function undo(){
  if (state.draft) {
    state.draft.pts.pop();
    if (!state.draft.pts.length) state.draft = null;
    renderHint(); redraw(); return;
  }
  if (state.shapes.length) { state.shapes.pop(); state.sel = null; markDirty(); renderHint(); redraw(); }
}

async function deleteSel(){
  if (state.draft) { finishDraft(); return; }          // the button is "Done" while drafting
  const s = state.shapes.find(x => x.id === state.sel);
  if (!s) return;
  if (!await confirmBox("Remove this label?", s.label ? `"${s.label}" will be removed from the sphere.` : "This shape will be removed.", "Remove")) return;
  state.shapes = state.shapes.filter(x => x.id !== s.id);
  state.sel = null; markDirty(); renderHint(); redraw();
}

function editLabel(shape){
  const sheet = $("labelSheet"), input = $("labelInput"), note = $("noteInput");
  sheet.hidden = false;
  input.value = shape.label || "";
  note.value = shape.note || "";
  renderNoteHint();
  input.focus();
  const commit = () => {
    shape.label = input.value.trim().slice(0, 80);
    const n = note.value.trim().slice(0, A.MAX_NOTE);
    if (n) shape.note = n; else delete shape.note;
    sheet.hidden = true; input.onkeydown = null; note.oninput = null;
    markDirty(); redraw();
  };
  $("btnLabelOk").onclick = commit;
  // Enter commits from the one-line label; the details box needs Enter for line breaks.
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); commit(); } };
  note.oninput = renderNoteHint;
}

function renderNoteHint(){
  const n = $("noteInput").value.length;
  $("noteHint").textContent = n
    ? `${n}/${A.MAX_NOTE} - tapping this shape in the viewer opens these details`
    : "Details are optional. Add them for anything that needs more than a name.";
}

/* ---- colour ---------------------------------------------------------------------------
   The palette lives in pano-annot.js so the swatch, the editor and the viewer can never drift.
   The choice is sticky across tools: drawing five hazards in a row should not mean picking red
   five times. Tapping a swatch with a shape selected recolours that shape.                   */
function renderSwatches(){
  const row = $("swatches");
  row.innerHTML = "";
  for (const key of A.PALETTE_ORDER) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sw-dot" + (key === state.color ? " on" : "");
    b.style.background = A.PALETTE[key].hex;
    b.title = key + " - " + A.PALETTE[key].means;
    b.setAttribute("aria-label", b.title);
    b.onclick = () => pickColor(key);
    row.appendChild(b);
  }
  const lab = document.createElement("span");
  lab.className = "sw-label";
  lab.textContent = A.PALETTE[state.color].means;
  row.appendChild(lab);
}

function pickColor(key){
  state.color = key;
  const sel = state.shapes.find(x => x.id === state.sel);
  if (sel) { sel.c = key; markDirty(); }
  if (state.draft) state.draft.c = key;
  renderSwatches(); redraw();
}

/* ============================================================ Open / save */
async function openPano(p){
  state.pano = p;
  state.key = A.panoKey(p.pano_url);
  if (!state.key) { toastMsg("That sphere's viewer URL is not one this tool understands."); return; }
  state.shapes = []; state.sel = null; state.draft = null; state.oid = null;
  state.publicOk = false; state.dirty = false; state.saving = false;
  $("drawTitle").firstChild.nodeValue = p.pano_name || "Sphere";
  $("drawSub").textContent = p.site_label || "";
  $("btnSave").disabled = true;
  $("pubOk").checked = false;
  showView("viewDraw");
  setTool("select");
  renderSwatches();

  // Existing labels first, so a re-edit starts from what is live rather than a blank sphere.
  try {
    const j = await rest(ANNOT_URL + "/query", {
      where: `pano_key = ${A.sqlQuote(state.key)}`, outFields: "*", returnGeometry: "false"
    }, {label: "labels"});
    const f = (j.features || [])[0];
    if (f) {
      state.oid = f.attributes.OBJECTID;
      state.publicOk = Number(f.attributes.public_ok) === 1;
      $("pubOk").checked = state.publicOk;
      try {
        const parsed = JSON.parse(f.attributes.annot_json || "{}");
        state.shapes = (parsed.shapes || []).filter(A.validShape)
          .map(s => ({id: s.id || newId(), kind: s.kind, label: s.label || "", pts: s.pts}));
      } catch (e) { toastMsg("The saved labels could not be read; starting empty."); }
    }
  } catch (e) { handleErr(e, "labels"); }

  // A draft beats the server copy: iOS reloads backgrounded tabs and the tech may have had to
  // leave for the Map tab to sign in.
  try {
    const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY(state.key)) || "null");
    if (d && Array.isArray(d.shapes) && d.shapes.length) {
      state.shapes = d.shapes; state.publicOk = !!d.publicOk; $("pubOk").checked = state.publicOk;
      state.dirty = true; $("btnSave").disabled = false;
      toastMsg("Restored your unsaved labels");
    }
  } catch (e) {}

  try { await mountViewer(p); }
  catch (e) { handleErr(e, "sphere"); return; }
  renderHint(); redraw();
}

async function mountViewer(p){
  teardownViewer();
  const url = new URL(p.pano_url, location.href);
  const tiles = url.searchParams.get("tiles"), img = url.searchParams.get("img");
  // Strip the filename off the PATH, never off href: ?tiles=tiles/0045 puts a slash in the query
  // string, so a regex over the whole href cuts in the wrong place.
  const base = url.origin + url.pathname.replace(/[^/]*$/, "");
  const common = {autoLoad: true, showZoomCtrl: true, showFullscreenCtrl: false, compass: false,
                  yaw: 0, pitch: 0, hfov: 100, friction: 0.18};
  let cfg;
  if (tiles) {
    const r = await fetch(base + tiles.replace(/\/$/, "") + "/config.json", {cache: "default"});
    if (!r.ok) throw new Error("tile config " + r.status);
    const j = await r.json();
    const mr = j.multiRes || {};
    mr.basePath = base + tiles.replace(/\/$/, "");
    // One level down on phones: this is a WebGL context inside an app with a documented iPhone
    // memory history, and the top level buys nothing at annotation zoom.
    if (COARSE && mr.maxLevel > 2) mr.maxLevel = mr.maxLevel - 1;
    cfg = Object.assign(common, {type: "multires", multiRes: mr});
  } else if (img) {
    cfg = Object.assign(common, {type: "equirectangular", panorama: base + img});
  } else {
    throw new Error("that viewer URL has no sphere in it");
  }
  state.viewer = pannellum.viewer("sphere", cfg);
  state.overlay = A.Overlay(state.viewer, {onRender: drawEdit});
  const host = state.viewer.getContainer();
  host.addEventListener("pointerdown", onPointerDown, true);
  host.addEventListener("pointermove", onPointerMove, true);
  host.addEventListener("pointerup", onPointerUp, true);
  host.addEventListener("pointercancel", () => { if (drag) { drag = null; suspendPan(false); } down = null; }, true);
}

function teardownViewer(){
  if (state.overlay) { try { state.overlay.destroy(); } catch (e) {} state.overlay = null; }
  if (state.viewer) { try { state.viewer.destroy(); } catch (e) {} state.viewer = null; }
  $("sphere").innerHTML = "";
}

function payload(){
  const shapes = state.shapes
    .filter(s => s.pts.length >= MIN_PTS[s.kind])
    .map(s => {
      const o = {id: s.id, kind: s.kind, label: s.label || "", pts: s.pts.map(p => [round2(p[0]), round2(p[1])])};
      if (s.c) o.c = s.c;                               // omitted when absent: keeps the JSON small
      if (s.note) o.note = s.note.slice(0, A.MAX_NOTE);
      return o;
    });
  return {shapes, json: JSON.stringify({v: 1, shapes})};
}

async function save(){
  if (state.saving) return;
  const {shapes, json} = payload();
  if (json.length > MAX_JSON) {
    toastMsg(`Too many labels to save (${json.length} of ${MAX_JSON} characters). Remove a few.`, 6000);
    return;
  }
  const unnamed = shapes.filter(s => !s.label).length;
  if (unnamed && !await confirmBox("Save without names?",
      `${unnamed} shape${unnamed === 1 ? " has" : "s have"} no label, so ${unnamed === 1 ? "it" : "they"} will draw with no text.`, "Save anyway")) return;

  state.saving = true; $("btnSave").disabled = true; $("btnSave").textContent = "Saving…";
  try {
    // No shapes left: drop the row rather than leaving an empty one behind.
    if (!shapes.length && state.oid) {
      await rest(ANNOT_URL + "/applyEdits", {deletes: String(state.oid)}, {label: "save"});
      state.oid = null; state.dirty = false; clearDraftStore();
      toastMsg("Labels removed from this sphere");
      return;
    }
    if (!shapes.length) { state.dirty = false; clearDraftStore(); toastMsg("Nothing to save"); return; }

    const p = state.pano;
    const attrs = {
      pano_key: state.key, annot_json: json, public_ok: state.publicOk ? 1 : 0,
      pano_url: String(p.pano_url).slice(0, 300), pano_name: String(p.pano_name || "").slice(0, 120),
      project_name: String(p.project_name || state.project || "").slice(0, 60),
      client_name: String(p.client_name || state.client || "").slice(0, 60),
      shape_count: shapes.length, updated_by: state.username.slice(0, 64),
      updated_at: Date.now(), app_version: APP_VERSION
    };
    const body = state.oid
      ? {updates: JSON.stringify([{attributes: Object.assign({OBJECTID: state.oid}, attrs)}])}
      : {adds: JSON.stringify([{attributes: attrs}])};
    const r = await rest(ANNOT_URL + "/applyEdits", body, {label: "save"});
    const res = (r.addResults || []).concat(r.updateResults || [])[0];
    if (!res || !res.success) throw new Error((res && res.error && res.error.description) || "ArcGIS rejected the write");
    if (!state.oid) state.oid = res.objectId;

    // Write-then-read: success:true has persisted nothing on this platform before.
    const back = await rest(ANNOT_URL + "/query", {
      where: "OBJECTID=" + state.oid, outFields: "shape_count,public_ok,annot_json", returnGeometry: "false"
    }, {label: "verify"});
    const a = ((back.features || [])[0] || {}).attributes;
    if (!a || Number(a.shape_count) !== shapes.length || (a.annot_json || "").length !== json.length) {
      throw new Error("ArcGIS reported success but the labels did not stick; try again");
    }
    state.dirty = false; clearDraftStore();
    toastMsg(state.publicOk ? "Saved — visible on the public gateway too" : "Saved — visible to signed-in WRI staff");
  } catch (e) {
    handleErr(e, "save");
  } finally {
    state.saving = false; $("btnSave").textContent = "Save"; $("btnSave").disabled = !state.dirty;
  }
}

async function leaveDraw(){
  if (state.dirty && !await confirmBox("Leave without saving?", "Your labels on this sphere have not been saved.", "Leave")) return;
  teardownViewer();
  state.pano = null; state.dirty = false;
  showView("viewPick");
  refreshList();
}

/* ============================================================ Wiring */
$("tSelect").onclick = () => setTool("select");
$("tPoint").onclick  = () => setTool("point");
$("tLine").onclick   = () => setTool("line");
$("tArea").onclick   = () => setTool("area");
$("tUndo").onclick   = undo;
$("tDelete").onclick = deleteSel;
$("btnSave").onclick = save;
$("btnBack").onclick = leaveDraw;
$("btnDone").onclick = leaveDraw;
$("btnReload").onclick = () => { try { sessionStorage.removeItem("wri_pano_sources"); } catch (e) {} boot(); };
$("search").oninput = e => { state.filter = e.target.value; renderPanos(new Map()); refreshAnnots(); };
$("pubOk").onchange = e => {
  state.publicOk = e.target.checked;
  markDirty();
  if (state.publicOk) toastMsg("These labels AND their details will be readable by anyone with the sphere link", 5000);
};

let annotT = null;
function refreshAnnots(){ clearTimeout(annotT); annotT = setTimeout(async () => { try { renderPanos(await loadAnnotated()); } catch (e) {} }, 250); }

// Free the WebGL context when the page is hidden. ExB keeps panels mounted after a page change,
// and this app has a documented iPhone memory history.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.viewer && !state.dirty) teardownViewer();
  else if (!document.hidden && state.pano && !state.viewer) mountViewer(state.pano).then(redraw).catch(e => handleErr(e, "sphere"));
});

async function boot(){
  clearInterval(authPoll);
  if (!A) { $("mapline").textContent = "pano-annot.js did not load; reload the page."; showView("viewPick"); return; }
  if (!getAuth()) { showAuth(); return; }
  try {
    await verifyAuth();
    $("whoLine").textContent = state.username;
    showView("viewPick");
    await currentMap();
    await discoverSources();
    await refreshList();
    // Deep link, so a future "Annotate" button anywhere can jump straight to a sphere.
    const want = params.get("pano_url");
    if (want) {
      const hit = state.panos.find(p => p.pano_url === want) || {pano_url: want, pano_name: params.get("title") || "Sphere"};
      openPano(hit);
    }
  } catch (e) { handleErr(e, "start"); if (e instanceof AuthError) showAuth(); }
}

window.addEventListener("online",  () => toastMsg("Back online"));
window.addEventListener("offline", () => toastMsg("Offline — saving will not work until you reconnect", 5000));
boot();
})();
</script>
</body>
</html>
