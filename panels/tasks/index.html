<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WRI Tasks</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#171919;--surface:#2a2c2c;--surface-alt:#3A3C3C;
    --accent:#EC2329;
    --text:#f0f0f0;--text-dim:#b8bcbc;--text-muted:#9a9e9e;
    --border:#4a4d4d;--success:#22c55e;--warning:#f59e0b;
    --font:'Alexandria',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;min-height:100vh}
  .topbar{
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:17px;font-weight:700;flex:1;font-family:'Epilogue','Alexandria',system-ui,sans-serif}
  .role-chip{
    padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;
    background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border);
    cursor:pointer;font-family:var(--font);white-space:nowrap;
  }
  .role-chip:active{opacity:0.8}
  .offline-banner{
    display:none;padding:8px 14px;background:#3b2a08;color:var(--warning);
    font-size:13px;text-align:center;
  }
  .offline-banner.show{display:block}
  #content{padding:14px;max-width:640px;margin:0 auto;padding-bottom:50px}
  .prompt{color:var(--text-dim);font-size:14px;margin:6px 2px 14px}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .role-card{
    min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:14px 12px;border-radius:12px;background:#3A3C3C;border:1px solid #55595a;
    color:var(--text);font-size:15px;font-weight:600;line-height:1.3;cursor:pointer;font-family:var(--font);
  }
  .role-card:active{transform:scale(0.97)}
  .phase-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
  .phase-btn{
    padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap;
    background:var(--surface);color:var(--text-dim);border:1px solid var(--border);
    cursor:pointer;font-family:var(--font);
  }
  .phase-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .progress{
    font-size:13px;color:var(--text-dim);margin:0 2px 12px;
  }
  .progress b{color:var(--success)}
  .section-title{
    font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--text-dim);margin:18px 0 8px 2px;
  }
  .task{
    display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
  }
  .task.done{opacity:0.55}
  .task.done .task-label{text-decoration:line-through}
  .task-check{
    width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--border);
    background:transparent;display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:15px;cursor:pointer;font-family:var(--font);
  }
  .task.done .task-check{background:var(--success);border-color:var(--success);color:#171919}
  .task-label{flex:1;font-size:14px;line-height:1.35}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:#111;color:#fff;border:1px solid #55595a;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  .toast button{margin-left:10px;min-height:44px;background:#EC2329;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;font-size:15px}
  .t214{color:#93c5fd}
  .task-note{font-size:12px;color:#86efac;margin-top:2px;text-decoration:none}
  .task-link{
    padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;
    color:#fff;text-decoration:none;background:#3A3C3C;
  }
  .task-link:active{opacity:0.8}
  .task-link.green{background:#3d5a3e}.task-link.red{background:#EC2329}
  .task-link.blue{background:#4a4d4d}.task-link.amber{background:#b45309}
  .task-link.orange{background:#b45309}.task-link.teal{background:#0d9488}
  .task-link.dark{background:#2a2c2c}.task-link.slate{background:#3A3C3C}
  .reset-row{text-align:center;margin-top:24px}
  .reset-btn{
    padding:10px 18px;border-radius:8px;font-size:13px;background:transparent;
    color:var(--text-muted);border:1px solid var(--border);cursor:pointer;font-family:var(--font);
  }
  .empty,.loading{color:var(--text-muted);text-align:center;padding:40px 20px;font-size:14px}
  .spin{
    width:26px;height:26px;margin:0 auto 12px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* In-panel form overlay — task launch buttons open here instead of a new tab */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
  .overlay[hidden]{display:none}
  .overlay-bar{
    display:flex;align-items:center;gap:10px;padding:8px 10px;
    background:var(--surface);border-bottom:1px solid var(--border);min-height:48px;
  }
  .ov-back{
    display:flex;align-items:center;gap:4px;padding:9px 14px;border-radius:8px;border:none;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;font-family:var(--font);white-space:nowrap;
  }
  .ov-back:active{opacity:0.85}
  .ov-title{
    flex:1;font-size:14px;font-weight:600;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ov-newtab{
    padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;
    color:var(--text-dim);text-decoration:none;border:1px solid var(--border);
  }
  .ov-newtab:active{opacity:0.8}
  .ov-frame-wrap{position:relative;flex:1;background:#fff}
  .ov-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ov-loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);pointer-events:none;
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1 id="title">WRI Field Tasks</h1>
    <button id="roleChip" class="role-chip" style="display:none" onclick="changeRole()">Change role</button>
  </div>
  <div id="offline" class="offline-banner">Offline &mdash; showing last saved checklist</div>
  <div id="content"><div class="loading"><div class="spin"></div>Loading&hellip;</div></div>
  <div id="toast" class="toast" hidden></div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-bar">
      <button class="ov-back" onclick="closeOverlay()">&#8249; Back</button>
      <div class="ov-title" id="ovTitle"></div>
      <a class="ov-newtab" id="ovNewTab" href="#" target="_blank" rel="noopener">Open in tab &#8599;</a>
    </div>
    <div class="ov-frame-wrap">
      <div class="ov-loading" id="ovLoading"><div class="spin"></div></div>
      <iframe id="ovFrame" title="Form" allow="geolocation; camera; microphone" allowfullscreen></iframe>
    </div>
  </div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbzcg-yD3_ALkdGYVEOuGY3VR8NrlsPRoxL6k-4LKX3SqEI6NlaKkpprKCtez2xo9C2u/exec';
  var CACHE_KEY = 'wri_tasks_cache';
  var PHASE_ORDER = ['initial', 'daily', 'demob'];

  // Hosts that refuse to render in an iframe (X-Frame-Options / CSP / login
  // redirects). Task links have no per-app Embed flag, so this list is the
  // only guard — everything else opens in the overlay.
  // app.mapnova.com used to be listed here; it serves CSP frame-ancestors * and
  // renders in-frame (verified 2026-09-17), so Nova links now open in the overlay.
  var NEVER_EMBED = ['docs.google.com', 'accounts.google.com',
                     'dashboard.pexcard.com', 'experience.arcgis.com', 'arcg.is'];

  function canEmbed(url) {
    var host;
    try { host = new URL(url).hostname; } catch (e) { return false; }
    return !NEVER_EMBED.some(function (b) { return host === b || host.slice(-(b.length + 1)) === '.' + b; });
  }

  var overlayOpen = false;

  function openOverlay(url, name) {
    // A fresh iframe per open: an iframe's FIRST navigation adds no joint
    // history entry, and removing the element (vs. navigating to about:blank)
    // adds none either — so the pushState entry below stays adjacent and
    // history.back() always pops the overlay, not an iframe navigation.
    var oldFrame = document.getElementById('ovFrame');
    if (oldFrame) oldFrame.remove();
    var frame = document.createElement('iframe');
    frame.id = 'ovFrame';
    frame.title = 'Form';
    frame.setAttribute('allow', 'geolocation; camera; microphone');
    frame.setAttribute('allowfullscreen', '');
    frame.onload = function () { document.getElementById('ovLoading').style.display = 'none'; };
    frame.src = url;
    document.getElementById('ovTitle').textContent = name || '';
    document.getElementById('ovNewTab').href = url;
    document.getElementById('ovLoading').style.display = '';
    document.querySelector('.ov-frame-wrap').appendChild(frame);
    document.getElementById('overlay').hidden = false;
    document.body.style.overflow = 'hidden';
    overlayOpen = true;
    // History entry so the hardware/browser Back button closes the overlay
    // instead of leaving the site (popstate handler below does the teardown).
    try { history.pushState({ wriOverlay: 1 }, ''); } catch (e) {}
  }

  function dismissOverlay() {
    var frame = document.getElementById('ovFrame');
    if (frame) frame.remove();
    document.getElementById('overlay').hidden = true;
    document.body.style.overflow = '';
    overlayOpen = false;
  }

  function closeOverlay() {
    // Dismiss FIRST, then rebalance history. Forms that navigate after load
    // (multi-page flows, in-form links, SPA pushState — e.g. Survey123) stack
    // joint-history entries above our wriOverlay marker, so a bare
    // history.back() would un-navigate the form instead of closing — the
    // button looks dead. Removing the iframe purges its joint entries, so
    // the back() below lands on the marker's predecessor.
    var hadMarker = overlayOpen && history.state && history.state.wriOverlay;
    dismissOverlay();
    if (hadMarker) {
      try { history.back(); } catch (e) {} // popstate no-ops (overlayOpen=false)
    }
  }

  window.addEventListener('popstate', function () {
    if (overlayOpen) dismissOverlay();
  });

  // page:<id> task links: the shell (same origin) changes page on popstate, as ExB's own menu does
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[data-page]') : null;
    if (!a) return;
    ev.preventDefault();
    try {
      var top = window.top, q = new URLSearchParams(top.location.search);
      q.set('page', a.getAttribute('data-page'));
      top.history.pushState(null, '', top.location.pathname + '?' + q.toString());
      top.dispatchEvent(new top.PopStateEvent('popstate', { state: null }));
    } catch (e) { window.open('/wri-field-app/?page=' + encodeURIComponent(a.getAttribute('data-page')), '_top'); }
  });
  window.addEventListener('storage', function (e) { if (e.key === 'wri_checkin_state') render(); });

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[data-open]') : null;
    if (!a) return;
    if (canEmbed(a.href)) {
      ev.preventDefault();
      openOverlay(a.href, a.getAttribute('data-name') || a.textContent);
    }
  });
  var roles = null;       // { roleId: { label, sections: [{title, tasks:[]}] } }
  var currentPhase = null;

  function loadCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && c.roles) return c.roles;
    } catch (e) {}
    return null;
  }

  function init() {
    flushPending();   // ticks saved while the outbox scripts couldn't load
    loadHaspPpe();
    fetchHaspPpe();
    var cached = loadCache();
    if (cached) { roles = cached; render(); }
    fetch(API + '?api=tasks')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.tasks) {
          roles = d.tasks;
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), roles: roles })); } catch (e) {}
          document.getElementById('offline').classList.remove('show');
          render();
        } else if (!cached) {
          document.getElementById('content').innerHTML =
            '<div class="empty">Task checklist is not available.<br>Use the Forms page to launch apps directly.</div>';
        }
      })
      .catch(function () {
        if (cached) document.getElementById('offline').classList.add('show');
        else document.getElementById('content').innerHTML =
          '<div class="empty">Could not load the checklist.<br>Check your connection and reload.</div>';
      });
  }

  // 2026-11-04 (batch 7): the PPE check names the HASP's ONE PPE list (same ?api=hasp + cache as the
  // HASP page), so the checklist and the plan can't disagree. No HASP summary = the sheet's wording.
  var HASP_CACHE = 'wri_hasp_cache', haspPpe = null;
  // 2026-11-04 (batch 7): the crew's incident, read like panels/board: ?incident= on the panel,
  // the map's picker (same origin), the phone's pick (incident-gate.js), the last map scope. '' = none.
  function haspPick() {
    try { var q = new URLSearchParams(location.search).get('incident'); if (q) return { id: q, label: q }; } catch (e) {}
    try { var w = window.top && window.top.__wriIncident; if (w && w.incident_id) return { id: String(w.incident_id), label: w.project_key || w.incident_name || String(w.incident_id) }; } catch (e) {}
    try { var c = JSON.parse(localStorage.getItem('wri_incident_choice') || 'null'); if (c && c.id && c.expires > Date.now()) return { id: String(c.id), label: c.key || c.name || String(c.id) }; } catch (e) {}
    try { var p = JSON.parse(localStorage.getItem('wri_incident_scope') || 'null'); if (p && p.id) return { id: String(p.id), label: p.key || p.name || String(p.id) }; } catch (e) {}
    return { id: '', label: '' };
  }
  var PICK = haspPick();
  var HASP_API = API + '?api=hasp' + (PICK.id ? '&incident=' + encodeURIComponent(PICK.id) : '');
  function ppeFrom(d) {
    var p = d && d.summary && d.summary.ppe;
    return p && p.items && p.items.length ? p : null;
  }
  function loadHaspPpe() {
    try { var c = JSON.parse(localStorage.getItem(HASP_CACHE)); if (c && String(c.incident || '') === PICK.id) haspPpe = ppeFrom(c.data); } catch (e) {}
  }
  function fetchHaspPpe() {
    fetch(HASP_API)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.hasp && d.hasp.noHaspForIncident) { haspPpe = null; render(); return; }   // checklist wording
        if (!(d && d.ok && d.hasp && !d.hasp.error)) return;
        try { localStorage.setItem(HASP_CACHE, JSON.stringify({ ts: Date.now(), incident: PICK.id, data: d })); } catch (e) {}
        haspPpe = ppeFrom(d);
        render();
      })
      .catch(function () {});
  }
  function taskLabel(t) {
    if (haspPpe && /^PPE check\b/i.test(t.label || '')) {
      return 'PPE check (from the HASP' + (haspPpe.level ? ', ' + haspPpe.level : '') + '): ' + haspPpe.items.join(', ');
    }
    return t.label;
  }

  // ids the Mission Hub label map doesn't name (it returns the id itself)
  var ROLE_NAMES = { field: 'Field Technician' };
  function roleLabel(id) {
    if (roles[id] && roles[id].label && roles[id].label !== id) return roles[id].label;
    if (ROLE_NAMES[id]) return ROLE_NAMES[id];
    return id.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function changeRole() {
    localStorage.removeItem('wri_role');
    currentPhase = null;
    render();
  }

  function selectRole(id) {
    localStorage.setItem('wri_role', id);
    currentPhase = null;
    render();
  }

  function selectPhase(p) {
    currentPhase = p;
    render();
  }

  function doneKey(role) { return 'wri_tasks_done_' + role; }

  function getDone(role) {
    try { return JSON.parse(localStorage.getItem(doneKey(role))) || {}; } catch (e) { return {}; }
  }
  // A tick holds its time (old ticks are 1). Daily tasks start fresh each day at 3 am, like the
  // incident pick; Initial and Demob ticks stay until Reset.
  function lastReset() { var d = new Date(); d.setHours(3, 0, 0, 0); if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1); return d.getTime(); }
  function isDone(done, t, phase) {
    if (isCheckIn(t) && checkedInName()) return true;
    var v = done[t.id];
    return !!v && (phase !== 'daily' || v > lastReset());
  }
  // "Check in" rows follow the phone's check-in (wri-checkin writes wri_checkin_state on this origin)
  function isCheckIn(t) {
    return (t.url === 'page:page_10' || /^check in and out app$/i.test(t.linkLabel || '')) && /^check in\b/i.test(t.label) && !/check out/i.test(t.label);
  }
  function checkedInName() {
    try { var s = JSON.parse(localStorage.getItem('wri_checkin_state') || 'null'); return s && s.name ? String(s.name) : ''; } catch (e) { return ''; }
  }

  function isDone_(done, t) { return isDone(done, t, currentPhase); }

  function toggleTask(role, taskId) {
    var done = getDone(role), t = findTask(role, taskId);
    var undoing = done[taskId] && (currentPhase !== 'daily' || done[taskId] > lastReset());
    if (undoing) delete done[taskId]; else done[taskId] = Date.now();
    try { localStorage.setItem(doneKey(role), JSON.stringify(done)); } catch (e) {}
    if (t && logs214(t)) { if (undoing) unlog214(role, t); else log214(role, t); }
    render();
  }
  function findTask(role, id) {
    var hit = null;
    ((roles[role] && roles[role].sections) || []).forEach(function (s) { (s.tasks || []).forEach(function (t) { if (t.id === id) hit = t; }); });
    return hit;
  }

  // ---------- a ticked daily task goes in the person's 214 (Cody, 2026-11-03) ----------
  // Same origin as WRI Field Forms (/wri-recon/), so the entry joins ITS outbox: saved on the phone,
  // uploaded with the incident PIN when there's signal, idempotent by id. The entry waits HOLD_MS so a
  // mis-tap can be unticked before it uploads. With no signal the Field Forms scripts may not load here,
  // so a tick is first kept in PENDING (localStorage); this page, or Field Forms when it next opens,
  // moves it into the outbox. Not logged: the self-ticking check-in row and rows that ARE the 214 log.
  var PENDING = 'wri_214_pending', LOGGED = 'wri_tasks_214_', HOLD_MS = 15000;
  function logs214(t) { return taskPhases(t).indexOf('daily') !== -1 && !isCheckIn(t) && !/#214$/.test(t.url || ''); }
  function lsJson(k, dflt) { try { return JSON.parse(localStorage.getItem(k) || 'null') || dflt; } catch (e) { return dflt; } }
  function lsPut(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function pickedIncident() {
    var c = lsJson('wri_incident_choice', null);
    return c && c.id && c.expires > Date.now()
      ? { incident_id: String(c.id), project_key: c.key || '', incident_name: c.name || c.key || '', client_name: c.client || '' } : null;
  }
  function myName() { return checkedInName() || localStorage.getItem('wri_recon_name') || ''; }
  function rid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 't-' + Date.now() + '-' + Math.random().toString(16).slice(2); }

  function log214(role, t) {
    var who = myName(), inc = pickedIncident();
    if (!who || !inc) {
      toast(!who ? 'Ticked. Check in on this phone and your daily ticks go to your 214 too.'
                 : 'Ticked. Pick the incident in the Field App and your daily ticks go to your 214 too.');
      return;
    }
    var id = rid(), now = Date.now();
    var rec = { recon_id: id, kind: '214', incident: inc, hold_until: now + HOLD_MS, from: 'checklist',
      fields: { person: who, position: localStorage.getItem('wri_214_pos') || '', activity: 'Checklist: ' + t.label, at: now,
        also_unit: false, section: localStorage.getItem('wri_214_section') || '' } };
    var pend = lsJson(PENDING, []); pend.push(rec); lsPut(PENDING, pend);
    var map = lsJson(LOGGED + role, {}); map[t.id] = { id: id, at: now }; lsPut(LOGGED + role, map);
    toast('Logged to your 214.', 'Undo', function () { toggleTask(role, t.id); });
    flushPending();
    setTimeout(function () { withOutbox(function () { Outbox.drain(); }); }, HOLD_MS + 1000);   // send once the undo window closes
  }
  function unlog214(role, t) {
    var map = lsJson(LOGGED + role, {}), hit = map[t.id];
    delete map[t.id]; lsPut(LOGGED + role, map);
    if (!hit) return;
    var pend = lsJson(PENDING, []), left = pend.filter(function (r) { return r.recon_id !== hit.id; });
    if (left.length !== pend.length) { lsPut(PENDING, left); toast('Removed from your 214.'); return; }
    withOutbox(function () {
      Store.get('records', hit.id).then(function (r) {
        if (r && r.status !== 'sent') return Outbox.discard(hit.id).then(function () { toast('Removed from your 214.'); });
        toast('It was already uploaded to your 214, so it stays there.');
      });
    });
  }
  function loggedNow(role, t) {   // logged today (shown on the row)
    var h = lsJson(LOGGED + role, {})[t.id];
    return !!h && h.at > lastReset();
  }

  // Field Forms' outbox scripts (config, store, api, outbox, forms) run here unchanged
  var obState = 0, obWait = [];
  function withOutbox(fn) {
    if (obState === 2) return fn();
    obWait.push(fn);
    if (obState === 1) return;
    obState = 1;
    var files = ['config', 'store', 'api', 'outbox', 'forms'], i = 0;
    (function next() {
      if (i === files.length) { obState = 2; var w = obWait; obWait = []; w.forEach(function (f) { try { f(); } catch (e) {} }); return; }
      var sc = document.createElement('script');
      sc.src = '/wri-recon/js/' + files[i++] + '.js';
      sc.onload = next;
      sc.onerror = function () { obState = 0; obWait = []; };   // no signal: the ticks wait in PENDING
      document.head.appendChild(sc);
    })();
  }
  function flushPending() {
    if (!lsJson(PENDING, []).length) return;
    withOutbox(function () {
      var pend = lsJson(PENDING, []);
      pend.reduce(function (p, r) {
        return p.then(function () { return Outbox.enqueue(r, []); }).then(function () {
          lsPut(PENDING, lsJson(PENDING, []).filter(function (x) { return x.recon_id !== r.recon_id; }));
        });
      }, Promise.resolve()).then(function () {
        var inc = pickedIncident();
        if (inc) return Outbox.pinFor(inc.incident_id).then(function (pin) {
          if (!pin) toast('Your 214 entries are saved on this phone and wait for the incident PIN. Open LOG 214 once to enter it.');
        });
      }).catch(function () {});
    });
  }
  window.addEventListener('online', flushPending);

  var toastTimer = null;
  function toast(msg, actLabel, act) {
    var el = document.getElementById('toast');
    el.innerHTML = '';
    el.appendChild(document.createTextNode(msg));
    if (actLabel) { var b = document.createElement('button'); b.textContent = actLabel; b.onclick = function () { el.hidden = true; act(); }; el.appendChild(b); }
    el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, actLabel ? HOLD_MS - 1000 : 6000);
  }

  function resetTasks(role) {
    localStorage.removeItem(doneKey(role));
    render();
  }

  // A task's phase cell may hold several comma-separated phases ("Initial,Daily")
  function taskPhases(t) {
    var list = (t.phase || '').toLowerCase().split(',')
      .map(function (p) { return p.trim(); })
      .filter(Boolean);
    return list.length ? list : ['general'];
  }

  function phasesFor(role) {
    var seen = {};
    (role.sections || []).forEach(function (sec) {
      (sec.tasks || []).forEach(function (t) {
        taskPhases(t).forEach(function (p) { seen[p] = 1; });
      });
    });
    var list = Object.keys(seen);
    list.sort(function (a, b) {
      var ia = PHASE_ORDER.indexOf(a), ib = PHASE_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    return list;
  }

  function render() {
    if (!roles) return;
    var roleId = localStorage.getItem('wri_role');
    var chip = document.getElementById('roleChip');

    // Role picker
    if (!roleId || !roles[roleId]) {
      chip.style.display = 'none';
      document.getElementById('title').textContent = 'WRI Field Tasks';
      var h = '<div class="prompt">Pick your role for this incident. You can change it any time.</div><div class="role-grid">';
      Object.keys(roles).forEach(function (id) {
        h += '<button class="role-card" onclick="selectRole(\'' + id + '\')">' + esc(roleLabel(id)) + '</button>';
      });
      document.getElementById('content').innerHTML = h + '</div>';
      return;
    }

    var role = roles[roleId];
    chip.style.display = '';
    chip.textContent = roleLabel(roleId) + ' • change';
    document.getElementById('title').textContent = 'Tasks';

    var phases = phasesFor(role);
    if (!currentPhase || phases.indexOf(currentPhase) === -1) currentPhase = phases[0];
    var done = getDone(roleId);

    var h = '';
    if (phases.length > 1) {
      h += '<div class="phase-row">';
      phases.forEach(function (p) {
        h += '<button class="phase-btn' + (p === currentPhase ? ' active' : '') + '" onclick="selectPhase(\'' + p + '\')">' +
          esc(p.charAt(0).toUpperCase() + p.slice(1)) + '</button>';
      });
      h += '</div>';
    }

    var total = 0, checked = 0, body = '';
    (role.sections || []).forEach(function (sec) {
      var tasks = (sec.tasks || []).filter(function (t) {
        return taskPhases(t).indexOf(currentPhase) !== -1;
      });
      if (!tasks.length) return;
      if (sec.title) body += '<div class="section-title">' + esc(sec.title) + '</div>';
      tasks.forEach(function (t) {
        total++;
        var isDone = isDone_(done, t);
        if (isDone) checked++;
        body += '<div class="task' + (isDone ? ' done' : '') + '">' +
          '<button class="task-check" onclick="toggleTask(\'' + roleId + '\',\'' + esc(t.id) + '\')">&#10003;</button>' +
          '<div class="task-label">' + esc(taskLabel(t)) +
          (isCheckIn(t) && checkedInName() ? '<div class="task-note">Checked in as ' + esc(checkedInName()) + '</div>' : '') +
          (isDone && loggedNow(roleId, t) ? '<div class="task-note t214">In your 214</div>' : '') + '</div>';
        if (t.url && /^page:/.test(t.url)) {   // a Field App page: switch the shell to it (no reload)
          body += '<a class="task-link ' + esc((t.buttonColor || 'slate').toLowerCase()) + '" href="#" data-page="' + esc(t.url.slice(5)) + '">' +
            esc(t.linkLabel || 'Open') + '</a>';
        } else if (t.url) {
          var c = (t.buttonColor || 'slate').toLowerCase();
          body += '<a class="task-link ' + esc(c) + '" href="' + esc(t.url) + '" target="_blank" rel="noopener" data-open' +
            ' data-name="' + esc(t.label) + '">' + esc(t.linkLabel || 'Open') + '</a>';
        }
        body += '</div>';
      });
    });

    if (total) h += '<div class="progress"><b>' + checked + '</b> / ' + total + ' complete</div>';
    if (total && currentPhase === 'daily') h += '<div class="task-note t214" style="margin:0 2px 10px">Ticking a daily task adds it to your 214 activity log.</div>';
    h += body || '<div class="empty">No tasks in this phase.</div>';
    if (total) h += '<div class="reset-row"><button class="reset-btn" onclick="resetTasks(\'' + roleId + '\')">Reset checklist</button></div>';
    document.getElementById('content').innerHTML = h;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  init();
</script>
</body>
</html>
