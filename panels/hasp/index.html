<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WRI HASP</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#171919;--surface:#2a2c2c;--surface-alt:#3A3C3C;
    --accent:#EC2329;
    --text:#f0f0f0;--text-dim:#b8bcbc;--text-muted:#9a9e9e;
    --border:#4a4d4d;--warning:#f59e0b;
    --font:'Alexandria',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100vh}
  .offline-banner{
    display:none;padding:8px 14px;background:#3b2a08;color:var(--warning);
    font-size:13px;text-align:center;border-radius:8px;margin-bottom:10px;
  }
  .offline-banner.show{display:block}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:12px;
  }
  .card h2{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px}
  .proj{font-size:20px;font-weight:700;margin-bottom:2px;font-family:'Epilogue','Alexandria',system-ui,sans-serif}
  .meta{font-size:13px;color:var(--text-dim);line-height:1.6}
  .meta b{color:var(--text);font-weight:600}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .btn{
    display:flex;align-items:center;justify-content:center;min-height:52px;
    padding:12px;border-radius:10px;font-size:15px;font-weight:700;color:#fff;
    text-decoration:none;text-align:center;line-height:1.3;
  }
  .btn:active{transform:scale(0.97);opacity:0.85}
  .btn.ack{background:var(--accent);grid-column:1 / -1;min-height:58px;font-size:16px}
  .btn.view{background:#4a4d4d}
  .btn.pdf{background:#3A3C3C}
  .full-link{
    display:block;text-align:center;margin:2px 0 12px;font-size:13px;
    color:var(--text-muted);text-decoration:underline;
  }
  .preview{
    flex:1;min-height:420px;border:1px solid var(--border);border-radius:12px;
    overflow:hidden;background:#fff;
  }
  .preview iframe{width:100%;height:100%;min-height:420px;border:none}
  /* r1 2026-11-12: the Google Docs preview lays the plan out at its page width (~820 px) and doesn't reflow, so at
     390 px the right side was cut off. Narrower than the page, the frame is drawn at page width and scaled to fit
     the box (fitPreview); "Read the full plan (PDF)" is there to read it full size. */
  .preview{position:relative}
  .preview.fit{height:var(--pv-h,420px);min-height:0;flex:none}
  .preview.fit iframe{position:absolute;left:0;top:0;min-height:0;transform-origin:0 0;
    width:var(--pv-w);height:var(--pv-fh);transform:scale(var(--pv-s))}
  .empty,.loading{color:var(--text-muted);text-align:center;padding:40px 20px;font-size:14px}
  .spin{
    width:26px;height:26px;margin:0 auto 12px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 2026-11-04 (batch 7): phone card first (sun + gloves: >=16 px, high contrast, >=56 px targets),
     then the full plan, then Acknowledge last so it comes after the reading */
  .sum{background:#0d0e0e;border:2px solid #f0f0f0;border-radius:12px;padding:14px;margin-bottom:12px;color:#fff;font-size:17px;line-height:1.4}
  .sec{border-top:1px solid #4a4d4d;padding:12px 0 2px;margin-top:10px}
  .lbl{font-size:16px;font-weight:700;color:#ffd166;margin-bottom:4px}
  .val{font-size:18px;font-weight:600;color:#fff;word-wrap:break-word}
  .val small{display:block;font-size:16px;font-weight:400;color:#e4e6e6;margin-top:2px}
  .call{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;margin:8px 0 0;
    padding:10px 14px;border-radius:12px;font-size:19px;font-weight:800;color:#fff;text-decoration:none;text-align:center;line-height:1.2;border:2px solid transparent}
  .call.e911{background:#d4141a;border-color:#fff}
  .call.wri{background:#1f5fbf}
  .call.hosp{background:#16794a}
  .call.dir{background:#3A3C3C;border-color:#9a9e9e;font-size:17px;font-weight:700}
  .call .num{font-weight:600;font-size:17px}
  .call:active{transform:scale(0.98)}
  .ppe-list{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .ppe-list li{background:#fff;color:#000;font-weight:700;font-size:17px;border-radius:8px;padding:6px 10px}
  .warn-box{background:#3b2a08;border:2px solid var(--warning);color:#ffe8b3;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:16px;line-height:1.4}
  .warn-box b{color:var(--warning);display:block;margin-bottom:4px}
  .warn-box ul{margin-left:18px}
  .step-h{font-size:16px;font-weight:700;color:#fff;margin:18px 2px 8px}
  .ack-card{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0 12px}
  .ack-card p{font-size:16px;color:#fff;margin-bottom:10px;line-height:1.4}
  .btn.ack{min-height:60px;font-size:18px;width:100%}
  .btn-row.one{grid-template-columns:1fr;margin-top:0}
  .btn.busy,.call.busy{pointer-events:none;opacity:.7}
  .btn.busy::after,.call.busy::after{content:'';width:16px;height:16px;margin-left:10px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;flex:none}
  /* 2026-11-05 (batch 11): Acknowledge signs in an in-panel overlay (WRI Field Forms ?embed=hasp, same
     origin, works with no signal), never a new tab; the result shows here and survives a reload */
  button.btn{border:0;width:100%;font-family:var(--font);cursor:pointer}
  button.btn:disabled{cursor:default}
  .btn.ack.signed{background:#16794a}
  .btn.ack.pending{background:#3b2a08;color:#ffe8b3;border:2px solid var(--warning)}
  .ack-who{font-size:16px;color:#e4e6e6;margin:0 0 10px}
  .ack-who b{color:#fff}
  .ack-status{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 12px;padding:12px;border-radius:10px}
  .ack-status.ok{background:#0f3d26;color:#c8f7dc;border:2px solid #16794a}
  .ack-status.wait{background:#3b2a08;color:#ffe8b3;border:2px solid var(--warning)}
  .ack-status.bad{background:#3d0f10;color:#ffd5d6;border:2px solid var(--accent)}
  .ack-status small{display:block;font-size:15px;font-weight:400;margin-top:4px}
  .overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
  .overlay[hidden]{display:none}
  .overlay-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);min-height:52px}
  .ov-back{display:flex;align-items:center;gap:4px;min-height:44px;padding:9px 16px;border-radius:8px;border:none;background:var(--accent);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap}
  .ov-back:active{opacity:0.85}
  .ov-title{flex:1;font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ov-frame-wrap{position:relative;flex:1;background:var(--bg)}
  .ov-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .ov-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;text-align:center;background:var(--bg);color:var(--text-dim);font-size:16px;line-height:1.45}
  .ov-loading[hidden]{display:none}
  .ov-loading .btn{max-width:320px}
</style>
</head>
<body>
<div class="wrap">
  <div id="offline" class="offline-banner">Offline &mdash; showing last saved HASP info</div>
  <div id="content"><div class="loading"><div class="spin"></div>Loading current HASP&hellip;</div></div>
</div>
<div id="ackOverlay" class="overlay" hidden role="dialog" aria-label="Sign the HASP">
  <div class="overlay-bar">
    <button class="ov-back" id="ackClose" type="button">&#x2715; Close</button>
    <div class="ov-title">Sign the HASP</div>
  </div>
  <div class="ov-frame-wrap" id="ackWrap">
    <div class="ov-loading" id="ackLoading"><div class="spin"></div><div id="ackLoadMsg">Opening the sign-off&hellip;</div></div>
  </div>
</div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbzcg-yD3_ALkdGYVEOuGY3VR8NrlsPRoxL6k-4LKX3SqEI6NlaKkpprKCtez2xo9C2u/exec';
  var CACHE_KEY = 'wri_hasp_cache';
  // 2026-11-04 (batch 7): the crew's incident, read like panels/board: ?incident= on the panel,
  // the map's picker (same origin), the phone's pick (incident-gate.js), the last map scope. '' = none.
  function haspPick() {
    try { var q = new URLSearchParams(location.search).get('incident'); if (q) return { id: q, label: q }; } catch (e) {}
    try { var w = window.top && window.top.__wriIncident; if (w && w.incident_id) return { id: String(w.incident_id), label: w.project_key || w.incident_name || String(w.incident_id) }; } catch (e) {}
    try { var c = JSON.parse(localStorage.getItem('wri_incident_choice') || 'null'); if (c && c.id && c.expires > Date.now()) return { id: String(c.id), label: c.key || c.name || String(c.id) }; } catch (e) {}
    try { var p = JSON.parse(localStorage.getItem('wri_incident_scope') || 'null'); if (p && p.id) return { id: String(p.id), label: p.key || p.name || String(p.id) }; } catch (e) {}
    return { id: '', label: '' };
  }
  var PICK = haspPick();
  var HASP_API = API + '?api=hasp' + (PICK.id ? '&incident=' + encodeURIComponent(PICK.id) : '');

  function loadCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY));
      // a saved plan only stands in for the same incident (old caches have no incident = no pick)
      if (c && c.data && String(c.incident || '') === PICK.id) return c.data;
    } catch (e) {}
    return null;
  }

  function init() {
    var cached = loadCache();
    if (cached) render(cached);
    fetch(HASP_API)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.hasp && d.hasp.noHaspForIncident) {   // never another incident's plan
          try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
          document.getElementById('offline').classList.remove('show');
          document.getElementById('content').innerHTML =
            '<div class="empty" id="noHasp" style="font-size:18px;color:#fff;line-height:1.5">No HASP issued for <b>' +
            esc(d.hasp.incident || PICK.label || 'this incident') + '</b> yet: ask the Safety Officer.</div>';
          return;
        }
        if (d && d.ok && d.hasp && !d.hasp.error) {
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), incident: PICK.id, data: d })); } catch (e) {}
          document.getElementById('offline').classList.remove('show');
          render(d);
        } else if (!cached) {
          document.getElementById('content').innerHTML =
            '<div class="empty">No HASP found' +
            (d && d.hasp && d.hasp.error ? '<br><small>' + esc(d.hasp.error) + '</small>' : '') +
            (d && d.haspUrl ? '<br><br><a class="full-link" href="' + esc(d.haspUrl) + '" target="_blank" rel="noopener">Open the HASP app to create one</a>' : '') +
            '</div>';
        }
      })
      .catch(function () {
        if (cached) document.getElementById('offline').classList.add('show');
        else document.getElementById('content').innerHTML =
          '<div class="empty">Could not load HASP info.<br>Check your connection and reload.</div>';
      });
  }

  function fmtDate(raw) {
    var d = new Date(raw);
    if (isNaN(d.getTime())) return raw;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  // 2026-11-04 (batch 7): the phone card: numbers to dial, hospital, meeting point, route, ONE PPE list, SO
  function telHref(n) { var t = String(n || '').replace(/[^\d+]/g, ''); return t ? 'tel:' + t : ''; }

  function summaryHtml(sm) {
    var h = '<div class="sum" id="haspSummary">';
    if (sm.checks && sm.checks.length) {
      h += '<div class="warn-box" id="haspChecks"><b>Check with the Safety Officer: parts of this plan look wrong</b><ul>' +
        sm.checks.map(function (c) { return '<li>' + esc(c.msg) + '</li>'; }).join('') + '</ul></div>';
    }
    h += '<div class="lbl">Emergency</div>';
    (sm.call && sm.call.length ? sm.call : [{ label: 'Emergency', number: '911', tel: '911' }]).forEach(function (c) {
      var href = telHref(c.tel || c.number);
      if (!href) return;
      var is911 = href === 'tel:911';
      h += '<a class="call ' + (is911 ? 'e911' : 'wri') + '" href="' + esc(href) + '">' +
        (is911 ? 'Call 911' : 'Call ' + esc(c.label || 'WRI') + ' <span class="num">' + esc(c.number) + '</span>') + '</a>';
    });
    if (sm.caller911) h += '<div class="val"><small>Calls 911 for the crew: ' + esc(sm.caller911) + '</small></div>';
    var hp = sm.hospital;
    if (hp) {
      var dist = [hp.distance, hp.driveTime ? hp.driveTime + ' drive' : ''].filter(Boolean).map(esc).join(' &middot; ');
      var hTel = telHref(hp.tel || hp.phone);
      h += '<div class="sec"><div class="lbl">Hospital</div><div class="val">' + esc(hp.name) +
        (hp.address ? '<small>' + esc(hp.address) + '</small>' : '') +
        (dist ? '<small id="hospDist">' + dist + '</small>' : '') + '</div>' +
        (hTel ? '<a class="call hosp" id="callHosp" href="' + esc(hTel) + '">Call hospital <span class="num">' + esc(hp.phone) + '</span></a>' : '') +
        (hp.directionsUrl ? '<a class="call dir" href="' + esc(hp.directionsUrl) + '" target="_blank" rel="noopener">Directions to hospital</a>' : '') +
        '</div>';
    }
    h += '<div class="sec"><div class="lbl">Meeting point</div><div class="val" id="meetPt">' + esc(sm.meetingPoint || 'Not set: ask the Safety Officer') + '</div></div>';
    h += '<div class="sec"><div class="lbl">Evacuation route</div><div class="val" id="evacRt">' + esc(sm.evacuationRoute || 'Not set: ask the Safety Officer') + '</div></div>';
    var ppe = sm.ppe || {};
    if ((ppe.items && ppe.items.length) || ppe.level) {
      h += '<div class="sec"><div class="lbl">Wear' + (ppe.level ? ' (PPE ' + esc(ppe.level) + ')' : '') + '</div>' +
        '<ul class="ppe-list" id="ppeList">' + (ppe.items || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
        (ppe.siteGear && ppe.siteGear.length ? '<div class="val"><small>On site: ' + ppe.siteGear.map(esc).join(', ') + '</small></div>' : '') + '</div>';
    }
    if (sm.safetyOfficer) h += '<div class="sec"><div class="lbl">Safety Officer</div><div class="val" id="soName">' + esc(sm.safetyOfficer) + '</div></div>';
    return h + '</div>';
  }

  var PREVIEW_W = 840;   // the Docs preview's page width + its margins, in CSS px
  function fitPreview() {
    var box = document.querySelector('.preview');
    if (!box) return;
    var w = box.clientWidth;
    if (!w || w >= PREVIEW_W) { box.classList.remove('fit'); return; }
    var s = w / PREVIEW_W, h = Math.max(420, Math.round(window.innerHeight * 0.6));
    box.style.setProperty('--pv-s', String(s));
    box.style.setProperty('--pv-w', PREVIEW_W + 'px');
    box.style.setProperty('--pv-h', h + 'px');
    box.style.setProperty('--pv-fh', Math.round(h / s) + 'px');
    box.classList.add('fit');
  }
  window.addEventListener('resize', fitPreview);
  function render(d) {
    var h = d.hasp, sm = d.summary || null;
    var html =
      '<div class="card">' +
        '<h2>Safety Plan (HASP)</h2>' +
        '<div class="proj">' + esc(h.projectName || 'HASP') + '</div>' +
        '<div class="meta">' +
          (h.client ? '<b>' + esc(h.client.toUpperCase()) + '</b> &middot; ' : '') +
          (h.location ? esc(h.location.trim()) + '<br>' : '') +
          (h.creator ? 'By ' + esc(h.creator.replace(/_/g, ' ')) + ' &middot; ' : '') +
          (h.timestamp ? esc(fmtDate(h.timestamp)) : '') +
        '</div>' +
      '</div>' +
      (sm ? summaryHtml(sm) : '') +
      // the full plan sits above Acknowledge, so the crew reads before they sign
      '<div class="step-h">Read the full plan</div>' +
      '<div class="btn-row">' +
        (h.pdfUrl ? '<a class="btn pdf" id="readPlan" href="' + esc(h.pdfUrl) + '" target="_blank" rel="noopener">Read the full plan (PDF)</a>' : '') +
        (h.docUrl ? '<a class="btn view" href="' + esc(h.docUrl) + '" target="_blank" rel="noopener">Open Doc</a>' : '') +
      '</div>' +
      (h.previewUrl ? '<div class="preview" style="margin-top:12px"><iframe src="' + esc(h.previewUrl) + '" title="HASP preview"></iframe></div>' : '') +
      (haspIdOf(h) ? '<div class="ack-card" id="ackCard"></div>' : '') +
      (d.haspUrl ? '<a class="full-link" href="' + esc(d.haspUrl) + '" target="_blank" rel="noopener">Open full HASP app (create / edit plans)</a>' : '');
    document.getElementById('content').innerHTML = html;
    fitPreview();
    ACK.hasp = h; ACK.id = haspIdOf(h);
    renderAck();
    sendInBackground();
  }

  // ---------- 2026-11-05 (batch 11): sign inside the app ----------
  // Acknowledge opens WRI Field Forms' HASP sign-off (/wri-recon/?embed=hasp, same origin) in an overlay:
  // saved on the phone first, sent by its outbox with the incident PIN (HASP V5 offline_ack, idempotent
  // by the record id; the ack writes the crew member's own 214). The frame reports
  // {type:'wri-hasp', v:1, status, haspId, name, at, ...} and also keeps localStorage.wri_hasp_acks,
  // so the result here (and the Checklist's HASP tick) survives a reload.
  var FORMS = '/wri-recon/', ACKS_KEY = 'wri_hasp_acks', STATUSES = { ready: 1, queued: 1, needs_pin: 1, sent: 1, failed: 1 };
  var ACK = { hasp: null, id: '', frame: null, open: false, busy: false, timer: 0, closeTimer: 0, triedUpdate: false, err: '' };
  function haspIdOf(h) {
    var id = String((h && h.objectId) || '');
    if (!id && h && h.ackUrl) { var m = /[?&]id=(\d+)/.exec(h.ackUrl); if (m) id = m[1]; }
    return /^\d{1,12}$/.test(id) ? id : '';
  }
  function checkinName() {
    try { var s = JSON.parse(localStorage.getItem('wri_checkin_state') || 'null'); return s && s.name ? String(s.name).trim() : ''; } catch (e) { return ''; }
  }
  function ackKey() { return PICK.id + '|' + ACK.id; }
  function ackState() {
    try { var a = JSON.parse(localStorage.getItem(ACKS_KEY) || '{}') || {}, s = a[ackKey()]; return s && STATUSES[s.status] ? s : null; } catch (e) { return null; }
  }
  function saveAckState(s) {
    try {
      var a = JSON.parse(localStorage.getItem(ACKS_KEY) || '{}') || {};
      a[ackKey()] = { name: s.name, at: s.at, status: s.status, sentAt: s.sentAt || 0, error: s.error || '', id: s.id || '' };
      localStorage.setItem(ACKS_KEY, JSON.stringify(a));
    } catch (e) {}
  }
  function fmtTime(t) { var d = new Date(Number(t)); return isNaN(d.getTime()) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

  function renderAck() {
    var card = document.getElementById('ackCard');
    if (!card) return;
    var s = ackState(), who = (s && s.name) || checkinName(), h = '';
    if (s && s.status === 'sent') {
      h = '<div class="ack-status ok" id="ackStatus">Signed ' + esc(fmtTime(s.at)) + ' as ' + esc(s.name) + '<small>The Safety Officer sees it, and it is in your 214.</small></div>' +
        '<button class="btn ack signed" id="ackBtn" type="button" disabled>Signed &#10003;</button>';
    } else if (s && s.status === 'queued') {
      h = '<div class="ack-status wait" id="ackStatus">Saved on this phone, it sends when you have signal' +
        '<small>Signed ' + esc(fmtTime(s.at)) + ' as ' + esc(s.name) + (navigator.onLine ? '. Sending now&hellip;' : '.') + '</small></div>' +
        '<button class="btn ack pending" id="ackBtn" type="button" disabled>Saved on this phone</button>';
    } else if (s && s.status === 'needs_pin') {
      h = '<div class="ack-status wait" id="ackStatus">Saved on this phone: it needs the incident PIN to send' +
        '<small>Signed ' + esc(fmtTime(s.at)) + ' as ' + esc(s.name) + '. Ask your lead for the PIN.</small></div>' +
        '<button class="btn ack" id="ackBtn" type="button" data-act="pin">Enter the incident PIN</button>';
    } else {
      var bad = ACK.err || (s && s.status === 'failed' ? (s.error || 'The sign-off could not be sent.') : '');
      h = (bad ? '<div class="ack-status bad" id="ackStatus">Not signed yet<small>' + esc(bad) + '</small></div>' : '') +
        '<p>Read the plan above, then sign that you have read it.</p>' +
        (who ? '<p class="ack-who" id="ackWho">You sign as <b>' + esc(who) + '</b>' + (s ? '' : ' (checked in on this phone)') + '.</p>' : '') +
        '<button class="btn ack' + (ACK.busy ? ' busy' : '') + '" id="ackBtn" type="button"' + (ACK.busy ? ' disabled aria-busy="true"' : '') + '>' +
        (bad ? 'Try again' : 'Acknowledge HASP') + '</button>';
    }
    card.innerHTML = h;
  }

  function frameUrl() {
    var h = ACK.hasp || {}, q = new URLSearchParams();
    q.set('embed', 'hasp'); q.set('hasp', ACK.id);
    if (PICK.id) q.set('incident', PICK.id);
    var who = checkinName(); if (who) q.set('name', who);
    if (h.projectName) q.set('project', h.projectName);
    return FORMS + '?' + q.toString() + '#hasp';
  }
  function loading(msg, retry) {
    var el = document.getElementById('ackLoading');
    el.hidden = false;
    el.innerHTML = retry
      ? '<div id="ackLoadMsg">' + esc(msg) + '</div><button class="btn ack" id="ackRetry" type="button">Retry</button>'
      : '<div class="spin"></div><div id="ackLoadMsg">' + esc(msg) + '</div>';
  }
  function setBusy(on) { ACK.busy = on; renderAck(); }
  /** a fresh frame (shown = the overlay; else it sends a saved sign-off in the background) */
  function makeFrame(show) {
    clearTimeout(ACK.timer);
    if (ACK.frame) ACK.frame.remove();
    var f = document.createElement('iframe');
    f.title = 'Sign the HASP'; f.id = 'ackFrame';
    f.onload = function () { frameLoaded(f); };
    f.src = frameUrl();
    ACK.frame = f;
    loading('Opening the sign-off…');
    document.getElementById('ackWrap').appendChild(f);
    // no answer from the frame = it did not open (no signal and Field Forms never opened on this phone)
    ACK.timer = setTimeout(function () { if (ACK.frame === f) frameFailed('The sign-off did not open. Check your signal, then tap Retry.'); }, 25000);
    return f;
  }
  function frameLoaded(f) {
    if (ACK.frame !== f) return;
    var ok = false;
    try { ok = !!(f.contentWindow && f.contentWindow.WRIHaspEmbed); } catch (e) { ok = false; }
    if (ok) return;   // its first status message hides the spinner
    // an old copy of Field Forms on this phone (no ?embed=hasp yet): update its service worker once, then reload
    if (!ACK.triedUpdate && navigator.onLine && navigator.serviceWorker) {
      ACK.triedUpdate = true;
      loading('Updating WRI Field Forms on this phone…');
      navigator.serviceWorker.getRegistration(FORMS).then(function (r) { return r && Promise.race([r.update(), new Promise(function (res) { setTimeout(res, 8000); })]); })
        .catch(function () {}).then(function () { if (ACK.frame === f) makeFrame(ACK.open); });
      return;
    }
    frameFailed(navigator.onLine ? 'The sign-off could not open here. Tap Retry.' : 'No signal, and the sign-off is not saved on this phone yet. Get signal, then tap Retry.');
  }
  function frameFailed(msg) {
    clearTimeout(ACK.timer);
    if (ACK.frame) { ACK.frame.remove(); ACK.frame = null; }
    setBusy(false);
    if (ACK.open) loading(msg, true);
    else { ACK.err = msg; renderAck(); }
  }

  function openAck() {
    if (ACK.busy || !ACK.id) return;
    var s = ackState();
    if (s && (s.status === 'sent' || s.status === 'queued')) return renderAck();   // never twice
    ACK.err = ''; ACK.triedUpdate = false; setBusy(true);
    document.getElementById('ackOverlay').hidden = false;
    document.body.style.overflow = 'hidden';
    ACK.open = true;
    try { history.pushState({ wriOverlay: 1 }, ''); } catch (e) {}   // Back closes the overlay
    makeFrame(true);
  }
  function dismissAck() {
    clearTimeout(ACK.closeTimer);
    document.getElementById('ackOverlay').hidden = true;
    document.body.style.overflow = '';
    ACK.open = false;
    var s = ackState();
    // a saved sign-off keeps its frame (hidden) so it can still send; otherwise drop it
    if (!(s && s.status === 'queued') && ACK.frame) { clearTimeout(ACK.timer); ACK.frame.remove(); ACK.frame = null; }
    setBusy(false);
  }
  function closeAck() {
    var hadMarker = ACK.open && history.state && history.state.wriOverlay;
    dismissAck();
    if (hadMarker) { try { history.back(); } catch (e) {} }
  }
  window.addEventListener('popstate', function () { if (ACK.open) dismissAck(); });

  /** a sign-off saved on the phone goes out from a hidden frame when there is signal */
  function sendInBackground() {
    var s = ackState();
    if (!ACK.id || ACK.open || ACK.frame || !navigator.onLine || !(s && s.status === 'queued')) return;
    makeFrame(false);
  }
  window.addEventListener('online', function () {
    renderAck();
    // a frame already holding the sign-off: tell it signal is back (WebKit fires 'online' on the top page only)
    if (ACK.frame) { try { ACK.frame.contentWindow.postMessage({ type: 'wri-hasp', action: 'report' }, location.origin); } catch (e) {} }
    else sendInBackground();
  });
  window.addEventListener('offline', renderAck);
  window.addEventListener('storage', function (e) { if (e.key === ACKS_KEY) renderAck(); });

  // the frame's reports: same origin, our frame, a known shape (treated as data only)
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.origin !== location.origin || !ACK.frame || e.source !== ACK.frame.contentWindow) return;
    if (!d || typeof d !== 'object' || d.type !== 'wri-hasp' || d.v !== 1 || !STATUSES[d.status] || String(d.haspId) !== ACK.id) return;
    clearTimeout(ACK.timer);
    document.getElementById('ackLoading').hidden = true;
    if (d.status === 'ready') { setBusy(false); return; }
    var name = typeof d.name === 'string' ? d.name.trim().slice(0, 120) : '';
    if (!name) return;
    var at = Number(d.at); if (!(at > 0)) at = Date.now();
    saveAckState({ name: name, at: at, status: d.status, sentAt: Number(d.sentAt) || 0,
      error: typeof d.error === 'string' ? d.error.slice(0, 300) : '', id: typeof d.id === 'string' ? d.id.slice(0, 64) : '' });
    ACK.err = ''; ACK.busy = false; renderAck();
    // saved or signed: show the result on the page; PIN / errors stay open so they can be fixed there
    if (ACK.open && (d.status === 'queued' || d.status === 'sent')) {
      clearTimeout(ACK.closeTimer); ACK.closeTimer = setTimeout(function () { if (ACK.open) closeAck(); }, 1500);
    }
    if (d.status === 'sent' && !ACK.open && ACK.frame) { ACK.frame.remove(); ACK.frame = null; }
  });

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('#ackBtn, #ackRetry, #ackClose');
    if (!b || b.disabled) return;
    if (b.id === 'ackClose') return closeAck();
    if (b.id === 'ackRetry') { ACK.triedUpdate = false; makeFrame(true); return; }
    openAck();
  });

  // busy state on every link-button until the new tab / dialer takes over (4 s)
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a.btn, a.call');
    if (!a || a.classList.contains('busy')) return;
    a.classList.add('busy'); a.setAttribute('aria-busy', 'true');
    setTimeout(function () { a.classList.remove('busy'); a.removeAttribute('aria-busy'); }, 4000);
  });

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
</script>
</body>
</html>
