<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Video</title>
<!--
  WRI drone live video panel (WRI Drone Cloud P5, 2026-10-28). Used by the Field App's Live Stream
  page and the "Drone Video" button on the response viewers (BNSF / UP / WRI / MT-WY).

  Frames https://drone.whitewaterrescue.com/live?embed=1 and hands it, by postMessage to that origin
  only, the app's own ArcGIS sign-in (exb_auth, same origin as every viewer on this Pages site) and
  the incident the map's Incident Picker shows (window.top.__wriIncident). The drone server checks the
  token is a WRI-org sign-in and shows that incident's drones, view only. With no ArcGIS sign-in (most
  Field App phones) the drone page asks for a PIN instead: the incident's Gateway PIN = watch only,
  the WRI crew PIN = watch + crew controls (start/stop video, camera + gimbal, client links). Check-out
  is the pilot's alone (sign out in Pilot 2).

  2026-11-04 (batch 8): the incident PIN Field Forms already saved on this phone (same github.io origin,
  IndexedDB 'wri-recon', kv 'pins' = {incident_id: pin}, else the old single kv 'pin') goes to the drone page
  in the URL fragment (#pin=..&inc=..): never the query string, so it never reaches a server log. The page
  signs in with it once, drops it from its address, and shows its PIN box as before if it's missing or wrong.
  The crew PIN is never passed.

  2026-11-05 (Tyler, Field App "Drone" menu): ?page=live|recorded|upload|missions picks which of the drone
  page's tabs show (Livestream / Recorded / Upload / Mission Planner); no ?page= = every tab (the response
  viewers' Drone Video button). Upload and Mission Planner are never unloaded when hidden (a video upload or a
  half-built mission would be lost); live video is. Recorded stays loaded too (2026-11-10): leaving it pauses
  any playing video (postMessage 'wri-live-pause') instead of reloading the page.

  Video stops 3 s after the page is hidden (same rule as the Live Stream panel) so a parked panel
  doesn't keep pulling video over a phone connection, except while the Upload tab is sending a
  video to Dropbox (the page says so with 'wri-live-busy'). Recorded / Upload tabs: P5b.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  /* WRI 2025 brand (same fonts as the drone pages inside, self-hosted there) */
  @font-face{font-family:'Epilogue';font-weight:100 900;font-display:swap;src:url(https://drone.whitewaterrescue.com/fonts/epilogue-latin.woff2) format('woff2')}
  @font-face{font-family:'Alexandria';font-weight:100 900;font-display:swap;src:url(https://drone.whitewaterrescue.com/fonts/alexandria-latin.woff2) format('woff2')}
  body{background:#171919;color:#f0f0f0;font-family:'Alexandria',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  #host{height:100%}
  #host iframe{width:100%;height:100%;border:0;display:block}
  #off{height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
  #off.on{display:flex}
  #off p{color:#b8bcbc;max-width:460px;font-size:15px}
  .btn{padding:12px 22px;border-radius:999px;background:#EC2329;color:#fff;font:700 13px/1.2 'Epilogue',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid #EC2329;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .08s ease}
  .btn:hover{background:#d41f24}
  .btn:active{transform:scale(.96);filter:brightness(.8)}
</style>
</head>
<body>
  <div id="host"></div>
  <div id="off"><p id="offMsg"></p><button class="btn" id="resume" type="button">Show drone video</button></div>
<script>
(function () {
  var SERVER = 'https://drone.whitewaterrescue.com';
  var TEARDOWN_MS = 3000;
  var host = document.getElementById('host'), off = document.getElementById('off');
  var frame = null, hiddenSince = null, uploading = false;
  var PAGE = (function () { var p = new URLSearchParams(location.search).get('page') || ''; return /^(live|recorded|upload|missions)$/.test(p) ? p : ''; })();
  // Upload opened for one kind (the Upload page's Drone photos / Videos sections): the uploader words itself for it
  var FOR = (function () { var p = new URLSearchParams(location.search).get('for') || ''; return /^(photos|videos)$/.test(p) ? p : ''; })();
  // typing / sending: never torn down. Recorded too (Tyler 2026-11-10: the "video stopped" reload is for
  // Livestream only): it stays loaded and is only asked to pause a playing video when hidden.
  var KEEP = PAGE === 'upload' || PAGE === 'missions' || PAGE === 'recorded';
  var paused = false;

  function exbToken() {
    var raw = null;
    try { raw = localStorage.getItem('exb_auth') || sessionStorage.getItem('exb_auth'); } catch (e) { return null; }
    try {
      var a = JSON.parse(raw || 'null');
      if (!a || !a.token) return null;
      var exp = a.expires != null && a.expires !== '' ? new Date(a.expires).getTime() : NaN;
      return isFinite(exp) && exp < Date.now() ? null : a.token;
    } catch (e) { return null; }
  }
  // the incident the map's picker shows on this device, else the phone's incident choice
  function incident() {
    try { var w = window.top && window.top.__wriIncident; if (w && w.incident_id) return String(w.incident_id); } catch (e) {}
    try { var c = JSON.parse(localStorage.getItem('wri_incident_choice') || 'null'); if (c && c.id && c.expires > Date.now()) return String(c.id); } catch (e) {}
    return '';
  }
  /* 2026-11-04 (batch 8): Field Forms' saved PIN for this incident ('' = none). Read only: it asks the
     browser first whether Field Forms' database exists (WebKit keeps an empty name behind even after an
     aborted open), and an open that would create it is aborted, so this never makes one. */
  function savedPin(inc) {
    return new Promise(function (done) {
      if (!inc || !window.indexedDB) return done('');
      var t = setTimeout(function () { fin(''); }, 1500), over = false;
      function fin(v) { if (over) return; over = true; clearTimeout(t); done(String(v || '').trim()); }
      function read() {
        var rq;
        try { rq = indexedDB.open('wri-recon'); } catch (e) { return fin(''); }
        rq.onupgradeneeded = function () { try { rq.transaction.abort(); } catch (e) {} };
        rq.onerror = function () { fin(''); };
        rq.onsuccess = function () {
          var db = rq.result;
          try {
            if (!db.objectStoreNames.contains('kv')) { db.close(); return fin(''); }
            var tx = db.transaction('kv', 'readonly'), kv = tx.objectStore('kv'), a = kv.get('pins'), b = kv.get('pin');
            tx.oncomplete = function () {
              var pins = (a.result && a.result.v) || {};
              db.close(); fin(pins[inc] || (b.result && b.result.v) || '');
            };
            tx.onerror = tx.onabort = function () { db.close(); fin(''); };
          } catch (e) { try { db.close(); } catch (x) {} fin(''); }
        };
      }
      if (!indexedDB.databases) return read();
      indexedDB.databases().then(function (l) {
        if ((l || []).some(function (d) { return d.name === 'wri-recon' && d.version > 0; })) read(); else fin('');
      }, read);
    });
  }
  function send() {
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: 'wri-live-auth', agol_token: exbToken(), incident: incident() }, SERVER);
  }

  function mount() {
    if (frame) return;
    frame = document.createElement('iframe');
    frame.title = 'WRI drone live video';
    frame.setAttribute('allow', 'autoplay; fullscreen');
    frame.setAttribute('allowfullscreen', '');
    host.appendChild(frame);
    var f = frame, inc = incident();
    savedPin(inc).then(function (pin) {
      if (frame !== f) return;   // closed meanwhile
      f.src = SERVER + '/live?embed=1' + (PAGE ? '&page=' + PAGE : '') + (FOR ? '&for=' + FOR : '') + (pin ? '#pin=' + encodeURIComponent(pin) + '&inc=' + encodeURIComponent(inc) : '');
    });
    off.classList.remove('on'); host.style.display = '';
  }
  function unmount(m) {
    if (frame) { try { frame.src = 'about:blank'; } catch (e) {} frame.remove(); frame = null; }
    host.style.display = 'none'; off.classList.add('on');
    document.getElementById('offMsg').textContent = m || '';
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (e.origin === SERVER && d.type === 'wri-live-ready') send();
    if (e.origin === SERVER && d.type === 'wri-live-busy') uploading = !!d.on;   // a video upload: never unload mid-way
    // Incident Picker switched incidents (posted by the map to same-origin panels)
    if (e.origin === location.origin && (d.type === 'wri-incident' || d.type === 'wri-incident-choice')) send();
  });
  // the app refreshes its sign-in now and then: pass the new one on (the page ignores an unchanged one)
  setInterval(send, 60e3);

  function isHidden() {
    if (document.visibilityState === 'hidden') return true;
    try { var fe = window.frameElement; if (fe) { var r = fe.getBoundingClientRect(); return r.width === 0 || r.height === 0; } } catch (e) {}
    return window.innerWidth === 0 || window.innerHeight === 0;
  }
  function check() {
    if (frame && PAGE === 'recorded') {
      var h = isHidden();
      if (h && !paused) { try { frame.contentWindow.postMessage({ type: 'wri-live-pause' }, SERVER); } catch (e) {} }
      paused = h;
    }
    if (!frame || uploading || KEEP) return;
    if (isHidden()) {
      if (hiddenSince === null) hiddenSince = Date.now();
      else if (Date.now() - hiddenSince >= TEARDOWN_MS) { hiddenSince = null; unmount('Video stopped when you left the page.'); }
    } else hiddenSince = null;
  }
  document.getElementById('resume').addEventListener('click', mount);
  document.addEventListener('visibilitychange', check);
  window.addEventListener('resize', check);
  if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement);
  setInterval(check, 1000);
  window.addEventListener('pagehide', function () { unmount(''); });
  mount();
})();
</script>
</body>
</html>
